<script type="text/markdown" data-id="incertidumbre" data-title="Razonamiento con Incertidumbre" data-tag="Probabilidad · Redes Bayesianas" data-icon="⚄" data-short="Incertidumbre" data-accent="--accent1">
# Razonamiento con incertidumbre

**Resumen detallado basado en dos referencias:**

- **Archivo 1:** *Cap. 19 - Razonamiento con Incertidumbre* de Nils Nilsson, capítulo de libro con desarrollo formal del tema.
- **Archivo 2:** *Razonamiento con Incertidumbre*, material de diapositivas que resume, ejemplifica y amplía didácticamente los mismos conceptos.

> Este documento integra ambos archivos. El archivo de Nilsson se toma como base teórica principal; las diapositivas se usan como apoyo didáctico para definiciones iniciales, ejemplos de probabilidad, probabilidad total, Bayes, redes bayesianas, separación-d e inferencia en poliárboles.

---

## 1. Idea central del tema

Un agente inteligente rara vez dispone de información completa y segura sobre su entorno. Muchas veces debe decidir o razonar con datos incompletos, sensores imperfectos, observaciones parciales o relaciones causales que no son deterministas. A esto se le llama **razonamiento con incertidumbre**.

La incertidumbre aparece cuando falta información adecuada para tomar una decisión o para llegar a una conclusión correcta. La lógica clásica permite expresar proposiciones como `P ∨ Q`, lo cual indica que al menos una de las dos proposiciones es verdadera, pero no permite indicar **cuánta confianza** se tiene en `P` o en `Q`. Por eso, para muchos problemas de inteligencia artificial, se necesita un formalismo que represente grados de creencia.

El enfoque principal de las referencias es el **razonamiento probabilístico**, especialmente mediante **redes bayesianas**, porque permiten representar variables inciertas, relaciones causales e independencias condicionales de manera más eficiente que una tabla completa de probabilidades conjuntas.

---

## 2. Conceptos previos de probabilidad

Las diapositivas comienzan con conceptos básicos que ayudan a entender el capítulo de Nilsson.

### 2.1 Suceso

Un **suceso** es un resultado o conjunto de resultados de un experimento aleatorio. Antes de realizarlo no se puede predecir con certeza qué ocurrirá.

Ejemplo: al lanzar un dado, obtener un `3` es un suceso.

### 2.2 Espacio muestral

El **espacio muestral** es el conjunto de todos los resultados posibles de un experimento aleatorio.

Ejemplo: al lanzar un dado:

```text
S = {1, 2, 3, 4, 5, 6}
```

Cada número representa un resultado posible.

### 2.3 Probabilidad

La **probabilidad** mide la frecuencia relativa con la que ocurre un suceso. Sus valores siempre están entre 0 y 1.

```text
0 ≤ P(A) ≤ 1
```

Además, la suma de las probabilidades de todos los sucesos elementales de un mismo espacio muestral debe ser 1.

```text
Σ P(suceso elemental) = 1
```

### 2.4 Probabilidad de la unión

Para dos sucesos `A` y `B`:

```text
P(A ∪ B) = P(A) + P(B) - P(A ∩ B)
```

Esto evita contar dos veces la parte común entre `A` y `B`.

Ejemplo de las diapositivas:

```text
A = {2, 4}
B = {4, 6}
A ∩ B = {4}
```

Entonces:

```text
P(A) = 2/6 = 1/3
P(B) = 2/6 = 1/3
P(A ∩ B) = 1/6
P(A ∪ B) = 1/3 + 1/3 - 1/6 = 1/2
```

Si `A` y `B` son incompatibles, no tienen intersección, por tanto:

```text
P(A ∪ B) = P(A) + P(B)
```

### 2.5 Probabilidad compuesta e independencia

Si dos sucesos `A` y `B` son independientes:

```text
P(A ∩ B) = P(A) · P(B)
```

Para varios sucesos independientes:

```text
P(A1 ∩ A2 ∩ ... ∩ An) = P(A1) · P(A2) · ... · P(An)
```

---

## 3. Variables aleatorias

En ambos archivos se trabaja con un conjunto de variables aleatorias:

```text
V1, V2, ..., Vk
```

Una variable aleatoria representa una característica relevante del dominio. Sus valores pueden ser:

- **Booleanos o proposicionales:** verdadero/falso, 1/0.
- **Numéricos:** altura, velocidad, temperatura, peso.
- **Categóricos:** color, sexo, letra, cara/cruz.

Ejemplo: el resultado de lanzar una moneda se representa con una variable `M`, cuyos valores pueden ser:

```text
CA = cara
CR = cruz
```

Si se lanza una moneda `k` veces, se necesitan `k` variables:

```text
M1, M2, ..., Mk
```

Cada una puede tomar el valor `CA` o `CR`.

---

## 4. Probabilidad conjunta

La **probabilidad conjunta** expresa la probabilidad de que varias variables tomen valores concretos al mismo tiempo.

Para variables `V1, V2, ..., Vk`:

```text
P(V1 = v1, V2 = v2, ..., Vk = vk)
```

También se escribe de forma abreviada:

```text
P(v1, v2, ..., vk)
```

Ejemplo de moneda:

```text
P(CA, CR, CR, CA, CR) = 1/32
```

Esto significa: probabilidad de que el primer lanzamiento sea cara, el segundo cruz, el tercero cruz, el cuarto cara y el quinto cruz.

Una función de probabilidad conjunta debe cumplir:

```text
0 ≤ P(V1, V2, ..., Vk) ≤ 1
Σ P(V1, V2, ..., Vk) = 1
```

---

## 5. Ejemplo del robot apilador de bloques

Los dos archivos utilizan el ejemplo de un robot que apila bloques. El dominio se representa con variables proposicionales. La notación cambia ligeramente entre referencias, pero la idea es la misma:

| Variable | Significado |
|---|---|
| `B` | La batería está cargada. |
| `S` | El brazo del robot se mueve. |
| `O` o `L` | El objeto/bloque se puede levantar. |
| `I` o `G` | El indicador muestra que la batería está cargada. |

Como son variables binarias, cada una puede ser verdadera o falsa. Con 4 variables binarias existen:

```text
2^4 = 16 combinaciones posibles
```

Por eso, una tabla completa de probabilidad conjunta para `B, S, O, I` requiere 16 valores. Las referencias muestran algunos valores de ejemplo:

| B | S | O/I según tabla | I | Probabilidad conjunta |
|---|---|---|---|---|
| Verdadero | Verdadero | Verdadero | Verdadero | 0,5686 |
| Verdadero | Verdadero | Verdadero | Falso | 0,0299 |
| Verdadero | Verdadero | Falso | Verdadero | 0,0135 |
| Verdadero | Verdadero | Falso | Falso | 0,0007 |

La idea importante es que, si se conocen todas las probabilidades conjuntas, se pueden calcular probabilidades marginales, condicionales y otras probabilidades de interés. Sin embargo, con muchas variables, la tabla se vuelve muy grande.

---

## 6. Probabilidad marginal

La **probabilidad marginal** de una variable se obtiene sumando las probabilidades conjuntas en las que esa variable tiene el valor buscado.

Ejemplo:

```text
P(B = b) = Σ P(B, S, O, I)   para todos los casos donde B = b
```

Si `B` es binaria y hay 4 variables, para calcular `P(B = Verdadero)` se suman las 8 filas donde `B` es verdadero.

En el ejemplo del robot, las referencias indican:

```text
P(B = Verdadero) = 0,95
```

Eso significa que, antes de observar otra evidencia, se cree que la batería está cargada con probabilidad 0,95.

También se pueden obtener probabilidades conjuntas de orden menor. Por ejemplo:

```text
P(B = b, S = s) = Σ P(B, S, O, I)   para todos los casos donde B = b y S = s
```

Este proceso de sumar variables que no interesan directamente se llama **marginalización**.

---

## 7. Notación abreviada para variables proposicionales

Cuando una variable proposicional está afirmada, se asume que vale verdadero. Cuando aparece negada, se asume que vale falso.

Ejemplos:

```text
P(B, ¬S)
```

significa:

```text
P(B = Verdadero, S = Falso)
```

Esta notación permite escribir fórmulas más cortas.

---

## 8. Probabilidad condicional

La **probabilidad condicional** mide la probabilidad de un evento dado que otro evento ya se conoce.

```text
P(Vi | Vj) = P(Vi, Vj) / P(Vj)
```

Donde:

- `P(Vi, Vj)` es la probabilidad conjunta.
- `P(Vj)` es la probabilidad marginal del evento condicionante.

Ejemplo del robot:

```text
P(B = Verdadero | S = Falso)
= P(B = Verdadero, S = Falso) / P(S = Falso)
```

Interpretación: probabilidad de que la batería esté cargada sabiendo que el brazo no se mueve.

En términos de frecuencia, una probabilidad condicional es una probabilidad conjunta normalizada: se observa solo el subconjunto de casos donde la condición ocurre y, dentro de ese subconjunto, se mide cuántas veces ocurre el evento consultado.

---

## 9. Regla de la cadena

La probabilidad conjunta de varias variables puede descomponerse como una cadena de probabilidades condicionales.

Para tres variables:

```text
P(A, B, C) = P(A | B, C) · P(B | C) · P(C)
```

De forma general:

```text
P(V1, V2, ..., Vk)
= Π P(Vi | Vi-1, ..., V1)
```

La regla de la cadena puede escribirse con distintos órdenes de variables. Todas las ordenaciones correctas deben producir la misma probabilidad conjunta.

---

## 10. Teorema de Bayes

A partir de la probabilidad condicional y de la simetría de la probabilidad conjunta:

```text
P(Vi, Vj) = P(Vi | Vj)P(Vj) = P(Vj | Vi)P(Vi)
```

se obtiene el **Teorema de Bayes**:

```text
P(Vi | Vj) = [P(Vj | Vi) · P(Vi)] / P(Vj)
```

En forma clásica:

```text
P(A | B) = [P(B | A) · P(A)] / P(B)
```

Bayes permite invertir el razonamiento: pasar de un efecto observado a una posible causa.

Ejemplo conceptual:

- `P(B | A)`: probabilidad de observar la evidencia `B` si la causa `A` fuera cierta.
- `P(A)`: probabilidad previa de la causa.
- `P(B)`: probabilidad total de la evidencia.
- `P(A | B)`: probabilidad posterior de la causa después de observar la evidencia.

---

## 11. Probabilidad total

Las diapositivas presentan la probabilidad total como una suma de probabilidades compuestas. Si `A1, A2, ..., An` forman una partición del espacio muestral y son incompatibles entre sí, entonces:

```text
P(B) = P(A1)P(B | A1) + P(A2)P(B | A2) + ... + P(An)P(B | An)
```

Ejemplo de fábricas:

| Fábrica | Producción | Defectos |
|---|---:|---:|
| F1 | 40% | 5% |
| F2 | 15% | 8% |
| F3 | 45% | 4% |

La probabilidad de tomar un coche defectuoso es:

```text
P(D) = 0,40·0,05 + 0,15·0,08 + 0,45·0,04
P(D) = 0,02 + 0,012 + 0,018
P(D) = 0,05 = 5%
```

Este ejemplo ayuda a entender el denominador del Teorema de Bayes, porque muchas veces `P(B)` se calcula sumando todas las formas posibles en que puede ocurrir `B`.

---

## 12. Inferencia probabilística

La **inferencia probabilística** consiste en calcular la probabilidad de una variable de consulta dado un conjunto de evidencias observadas.

Escenario general:

- Se tiene un conjunto de variables:

```text
V = {V1, V2, ..., Vk}
```

- Se observa un subconjunto de evidencia:

```text
E = e
```

- Se desea calcular:

```text
P(Vi = vi | E = e)
```

Ejemplo: calcular la probabilidad de que la batería esté cargada sabiendo que el brazo no se mueve.

Como las variables proposicionales son verdaderas o falsas:

```text
P(Vi = Verdadero | E = e) + P(Vi = Falso | E = e) = 1
```

Por tanto, basta calcular una de las dos probabilidades y la otra se obtiene por complemento.

### 12.1 Método exhaustivo

El método directo usa la definición de probabilidad condicional:

```text
P(Vi = Verdadero | E = e)
= P(Vi = Verdadero, E = e) / P(E = e)
```

El numerador se calcula sumando todas las probabilidades conjuntas compatibles con `Vi = Verdadero` y con la evidencia `E = e`.

Este método funciona, pero es costoso. Si hay `k` variables binarias, se necesitan:

```text
2^k probabilidades conjuntas
```

Por eso se vuelve intratable cuando el número de variables crece.

### 12.2 Ejemplo con P, Q, R

Las referencias presentan un ejemplo con probabilidades conjuntas de `P`, `Q` y `R`, donde la evidencia es `¬R` y se desea calcular:

```text
P(Q | ¬R)
```

Se suman los casos compatibles con `Q` y `¬R`:

```text
P(Q, ¬R) = P(P, Q, ¬R) + P(¬P, Q, ¬R)
P(Q, ¬R) = 0,2 + 0,1 = 0,3
```

También se calcula `P(¬Q, ¬R)`:

```text
P(¬Q, ¬R) = P(P, ¬Q, ¬R) + P(¬P, ¬Q, ¬R)
P(¬Q, ¬R) = 0,1 + 0,0 = 0,1
```

Como ambas probabilidades condicionadas deben sumar 1:

```text
P(Q | ¬R) = 0,3 / (0,3 + 0,1) = 0,75
```

---

## 13. Independencia condicional

La **independencia condicional** es la idea clave que permite simplificar el razonamiento probabilístico.

Una variable `V` es condicionalmente independiente de un conjunto de variables `X`, dado otro conjunto `Y`, cuando conocer `X` no aporta información adicional sobre `V` si ya se conoce `Y`.

```text
P(V | X, Y) = P(V | Y)
```

Se puede escribir como:

```text
I(V, X | Y)
```

Interpretación: si `Y` ya está conocido, `X` se puede ignorar para calcular la probabilidad de `V`.

Ejemplo del robot:

Si ya se sabe que la batería está cargada (`B`), entonces conocer el indicador (`I`) ya no aporta información adicional sobre si el brazo se mueve (`S`):

```text
P(S | B, I) = P(S | B)
```

La independencia condicional reduce la cantidad de probabilidades que se deben especificar y calcular.

### 13.1 Independencia mutua

Si varias variables son independientes dado un conjunto `Y`, entonces la probabilidad conjunta se puede factorizar:

```text
P(V1, V2, ..., Vk | Y)
= P(V1 | Y) · P(V2 | Y) · ... · P(Vk | Y)
```

Si `Y` está vacío, se habla de independencia incondicional:

```text
P(V1, V2, ..., Vk) = P(V1)P(V2)...P(Vk)
```

---

## 14. Redes bayesianas

Una **red bayesiana** es un modelo gráfico probabilístico formado por:

- Un **grafo dirigido acíclico**.
- **Nodos**, que representan variables aleatorias.
- **Arcos o flechas**, que representan influencia directa entre variables.
- **Tablas de probabilidad condicional** para cada nodo.

Si hay una flecha de `X` hacia `Y`, se interpreta que `X` influye directamente sobre `Y`.

La red no puede tener ciclos dirigidos. Es decir, no puede haber un camino de flechas que regrese al mismo nodo.

### 14.1 Padres de un nodo

Los **padres** de un nodo son las variables cuyas flechas apuntan hacia él.

Ejemplo:

```text
B  →  S
O  →  S
```

Aquí, `B` y `O` son padres de `S`.

### 14.2 Supuesto de independencia de una red bayesiana

Una red bayesiana establece que cada nodo es condicionalmente independiente de sus no descendientes, dados sus padres.

En palabras simples:

> Para calcular la probabilidad de un nodo, basta mirar sus padres directos; no es necesario mirar todos los demás nodos, siempre que se respeten las independencias de la red.

### 14.3 Factorización de la probabilidad conjunta

Si los nodos de la red son:

```text
V1, V2, ..., Vk
```

entonces la probabilidad conjunta se factoriza como:

```text
P(V1, V2, ..., Vk) = Π P(Vi | Padres(Vi))
```

Esta es una de las fórmulas más importantes del tema.

Sin red bayesiana, con 4 variables binarias se requieren 16 probabilidades conjuntas. Con una red que capture independencias, se requieren muchas menos probabilidades locales.

---

## 15. Red bayesiana del robot

En el ejemplo del robot, se parte de causas iniciales:

- `B`: batería cargada.
- `O` o `L`: objeto/bloque elevable.

Estas causas influyen en:

- `S`: el brazo se mueve.

Además:

- `B` influye en `I` o `G`: el indicador muestra que la batería está cargada.

La estructura conceptual es:

```text
B  →  S  ←  O/L
↓
I/G
```

La probabilidad conjunta de la red puede expresarse como:

```text
P(I/G, B, S, O/L) = P(I/G | B) · P(S | B, O/L) · P(B) · P(O/L)
```

Esto es mucho más simple que una tabla completa de 16 combinaciones, porque se aprovechan las relaciones causales y las independencias condicionales.

---

## 16. Tablas de probabilidad condicional

Cada nodo con padres necesita una **tabla de probabilidad condicional**.

Ejemplo para `S`, cuyos padres son `B` y `O/L`:

```text
P(S | B, O/L)
P(S | B, ¬O/L)
P(S | ¬B, O/L)
P(S | ¬B, ¬O/L)
```

Cada fila expresa qué tan probable es que el brazo se mueva bajo una combinación de causas.

Los nodos sin padres solo requieren probabilidades a priori:

```text
P(B)
P(O/L)
```

---

## 17. Patrones de inferencia en redes bayesianas

Las referencias destacan tres patrones principales.

### 17.1 Inferencia causal o descendente

Va de las causas hacia los efectos.

Ejemplo:

```text
P(S | O)
```

Se pregunta: ¿cuál es la probabilidad de que el brazo se mueva si el objeto se puede levantar?

Como `O` es una causa de `S`, este es razonamiento causal.

La inferencia considera también el otro padre de `S`, que es `B`:

```text
P(S | O) = P(S, B | O) + P(S, ¬B | O)
```

Luego:

```text
P(S | O)
= P(S | B, O)P(B | O) + P(S | ¬B, O)P(¬B | O)
```

Como `B` y `O` son independientes en la red:

```text
P(B | O) = P(B)
P(¬B | O) = P(¬B)
```

Entonces:

```text
P(S | O)
= P(S | B, O)P(B) + P(S | ¬B, O)P(¬B)
```

Las referencias indican que con los valores de la red se obtiene:

```text
P(S | O) = 0,855
```

### 17.2 Inferencia de diagnóstico o ascendente

Va de los efectos hacia las causas.

Ejemplo:

```text
P(¬O | ¬S)
```

Se pregunta: si el brazo no se mueve, ¿cuál es la probabilidad de que el objeto no pueda levantarse?

Aquí se observa un efecto (`¬S`) y se infiere una causa (`¬O`). Por eso se usa Bayes para convertir el problema en uno más manejable.

La referencia de Nilsson muestra que:

```text
P(¬O | ¬S) = 0,88632
```

Interpretación: si el brazo no se mueve, aumenta mucho la sospecha de que el objeto no se puede levantar, aunque también podrían existir otras causas, como batería descargada.

### 17.3 Inferencia intercausal o justificación

Ocurre entre causas de un mismo efecto. También se conoce como **explicación alternativa** o *explaining away*.

Ejemplo:

- Se sabe que el brazo no se mueve: `¬S`.
- Esto puede deberse a que el objeto no se puede levantar: `¬O`.
- Pero si además se sabe que la batería no está cargada: `¬B`, entonces la batería descargada explica el fallo del brazo.

Por eso, la probabilidad de `¬O` baja:

```text
P(¬O | ¬B, ¬S) = 0,030
```

Esto es mucho menor que:

```text
P(¬O | ¬S) = 0,88632
```

La idea es que una causa observada puede “justificar” el efecto y hacer menos probable otra causa alternativa.

---

## 18. Evidencia con incertidumbre

Las referencias advierten que no siempre se puede usar directamente una evidencia incierta como si fuera verdadera o falsa.

La expresión:

```text
P(V | E)
```

solo es adecuada cuando `E` se conoce con certeza.

Si la evidencia viene de un sensor poco confiable, debe modelarse como otro nodo en la red.

Ejemplo:

- `S`: el brazo realmente se mueve.
- `S'`: el sensor dice que el brazo se mueve.

La red necesita probabilidades como:

```text
P(S' | S)
P(S' | ¬S)
```

Estas probabilidades representan la fiabilidad del sensor.

Entonces, si se observa el sensor, se calcula algo como:

```text
P(¬O | ¬B, ¬S')
```

en lugar de:

```text
P(¬O | ¬B, ¬S)
```

La diferencia es importante: `S'` es una observación del sensor; `S` es el estado real del mundo.

---

## 19. Separación-d

La **separación-d** permite identificar independencias condicionales en una red bayesiana observando su estructura gráfica.

Dos nodos son condicionalmente independientes dado un conjunto de evidencia `E` si todos los caminos no dirigidos entre ellos están bloqueados por `E`.

### 19.1 Camino bloqueado

Un nodo `Vb` bloquea un camino si se cumple alguna de estas condiciones:

1. `Vb` pertenece a la evidencia y ambos arcos salen de `Vb`.
2. `Vb` pertenece a la evidencia y un arco entra a `Vb` y otro sale de `Vb`.
3. Ni `Vb` ni ninguno de sus descendientes pertenece a la evidencia, y ambos arcos entran a `Vb`.

### 19.2 Tres estructuras básicas

#### a) Cadena causal

```text
X → Y → Z
```

Si se observa `Y`, se bloquea el camino entre `X` y `Z`.

Ejemplo: presencia activa un sensor y el sensor enciende una luz. Si ya se sabe qué pasó con el sensor, la presencia y la luz quedan separadas respecto a esa ruta.

#### b) Causa común

```text
X ← Y → Z
```

`Y` es causa común de `X` y `Z`. Si se observa `Y`, se bloquea el camino entre `X` y `Z`.

Ejemplo: clima frío causa mayor uso de calefacción y mayor consumo eléctrico. Si ya se conoce el clima, saber que hay calefacción no añade tanta información sobre el consumo por esa ruta.

#### c) Efecto común o colisionador

```text
X → Y ← Z
```

Si no se observa `Y` ni sus descendientes, el camino entre `X` y `Z` está bloqueado. Pero si se observa `Y` o un descendiente de `Y`, el camino se activa y `X` y `Z` se vuelven dependientes condicionalmente.

Ejemplo: movimiento y ruido pueden activar una alarma. Si no se sabe si la alarma se activó, movimiento y ruido pueden ser independientes. Pero si se sabe que la alarma se activó y además se sabe que no hubo movimiento, entonces aumenta la probabilidad de que haya habido ruido.

Esta es la base de la inferencia intercausal.

---

## 20. Poliárboles

Un **poliárbol** es un grafo dirigido acíclico donde, entre cada par de nodos, existe como máximo un camino no dirigido.

También se llama red de conexión única.

Las referencias explican que la inferencia en redes bayesianas generales puede ser costosa, pero en poliárboles se puede simplificar. En estos casos, los algoritmos de apoyo causal y apoyo evidencial tienen complejidad lineal respecto al número de nodos.

---

## 21. Inferencia probabilística en poliárboles

Las referencias presentan una red abstracta donde se desea calcular la probabilidad de un nodo `Q` usando evidencia distribuida en la red.

Se distinguen tres casos.

### 21.1 Apoyo causal

La evidencia está por encima de `Q`, es decir, en sus causas o antecesores.

Ejemplo:

```text
P(Q | P5, P4)
```

El cálculo se hace mediante un algoritmo recursivo ascendente. La idea es involucrar a los padres de `Q`, fragmentar por independencia condicional y seguir subiendo hasta llegar a la evidencia o a nodos sin padres.

Forma conceptual:

```text
P(Q | evidencia superior)
= suma sobre padres de Q [P(Q | padres) · probabilidad de los padres dada la evidencia]
```

La separación-d permite tratar por separado las ramas independientes.

### 21.2 Apoyo evidencial

La evidencia está por debajo de `Q`, es decir, en sus efectos o descendientes.

Ejemplo:

```text
P(Q | P12, P13, P14, P11)
```

Aquí se usa Bayes:

```text
P(Q | evidencia inferior) = k · P(evidencia inferior | Q) · P(Q)
```

Donde `k` es una constante de normalización.

La evidencia inferior se separa según los hijos de `Q`, usando separación-d.

### 21.3 Apoyo causal y evidencial combinado

Hay evidencia por encima y por debajo de `Q`.

Ejemplo:

```text
P(Q | E+, E-)
```

Donde:

- `E+` = evidencia causal, ubicada por encima de `Q`.
- `E-` = evidencia evidencial, ubicada por debajo de `Q`.

La fórmula general presentada es:

```text
P(Q | E+, E-) = k · P(E- | Q) · P(Q | E+)
```

La primera parte, `P(E- | Q)`, se calcula con apoyo evidencial. La segunda, `P(Q | E+)`, se calcula con apoyo causal.

---

## 22. Redes que no son poliárboles

Cuando la red no es un poliárbol, los procedimientos recursivos simples pueden fallar o repetir cálculos por los múltiples caminos entre nodos.

Las referencias mencionan alternativas:

### 22.1 Eliminación de compartimiento o eliminación de variables

Organiza los cálculos para evitar subcálculos redundantes.

### 22.2 Muestreo lógico o método de Monte Carlo

Se generan muchas asignaciones aleatorias de valores a los nodos, siguiendo las probabilidades de la red. Después de muchas repeticiones, se estima la probabilidad buscada contando frecuencias.

Ejemplo conceptual:

```text
P(Q | E) ≈ número de veces que Q y E ocurren / número de veces que E ocurre
```

### 22.3 Agrupamiento

Agrupa varios nodos en “meganodos” para transformar la red en una estructura parecida a un poliárbol. Luego se aplican algoritmos de inferencia sobre esos grupos.

---

## 23. Fórmulas clave

| Concepto | Fórmula |
|---|---|
| Unión | `P(A ∪ B) = P(A) + P(B) - P(A ∩ B)` |
| Eventos incompatibles | `P(A ∪ B) = P(A) + P(B)` |
| Complemento | `P(¬A) = 1 - P(A)` |
| Independencia | `P(A ∩ B) = P(A)P(B)` |
| Condicional | `P(A | B) = P(A, B) / P(B)` |
| Conjunta desde condicional | `P(A, B) = P(A | B)P(B)` |
| Regla de la cadena | `P(A, B, C) = P(A | B, C)P(B | C)P(C)` |
| Bayes | `P(A | B) = P(B | A)P(A) / P(B)` |
| Probabilidad total | `P(B) = Σ P(Ai)P(B | Ai)` |
| Factorización en red bayesiana | `P(V1,...,Vk) = Π P(Vi | Padres(Vi))` |
| Independencia condicional | `P(V | X, Y) = P(V | Y)` |
| Apoyo causal y evidencial | `P(Q | E+, E-) = kP(E- | Q)P(Q | E+)` |

---

## 24. Diferencia entre inferencia lógica e inferencia probabilística

| Aspecto | Lógica clásica | Razonamiento probabilístico |
|---|---|---|
| Tipo de conclusión | Verdadera o falsa | Grado de creencia entre 0 y 1 |
| Ejemplo | Si `P` y `P → Q`, entonces `Q` | Si se observa evidencia, se actualiza `P(Q | evidencia)` |
| Manejo de incertidumbre | Limitado | Central |
| Representación | Proposiciones y reglas | Variables aleatorias y distribuciones |
| Herramienta principal del tema | Inferencia deductiva | Probabilidad, Bayes y redes bayesianas |

---

## 25. Síntesis comparativa de los dos archivos

| Tema | Archivo 1: Nilsson | Archivo 2: Diapositivas |
|---|---|---|
| Introducción | Presenta la limitación de la lógica clásica y justifica el uso de probabilidades. | Define incertidumbre de forma sencilla y plantea preguntas introductorias. |
| Probabilidad básica | Explica variables aleatorias, probabilidad conjunta, marginal y condicional. | Agrega definiciones previas: suceso, espacio muestral, unión, independencia, probabilidad total. |
| Ejemplos | Robot apilador, tablas conjuntas, inferencia con P/Q/R, redes bayesianas. | Dados, fábricas, diagramas de Bayes, ejemplos visuales de redes. |
| Bayes | Se deriva formalmente desde la probabilidad condicional. | Se explica con particiones, “medición del futuro” y “medición del pasado”. |
| Redes bayesianas | Desarrollo formal: grafo dirigido acíclico, independencia condicional, factorización. | Resume la definición y muestra fórmulas de factorización con ejemplos. |
| Patrones de inferencia | Explica causal, diagnóstico e intercausal con cálculos. | Repite los tres patrones de forma más esquemática. |
| Evidencia incierta | Introduce nodos de sensor, como `S'`, para modelar observaciones no confiables. | Reafirma que no debe tratarse evidencia incierta como si fuera segura. |
| Separación-d | Presenta reglas de bloqueo y consecuencias de independencia. | Resume reglas y añade ejemplos intuitivos de cadena, causa común y colisionador. |
| Poliárboles | Explica apoyo causal, evidencial y mixto con fórmulas extensas. | Resume los casos y presenta la idea recursiva en diapositivas. |

Conclusión de la comparación: ambos archivos tratan el mismo tema. El primero es más formal y matemático; el segundo es más didáctico y visual. Juntos permiten entender tanto la base teórica como la aplicación práctica del razonamiento con incertidumbre.

---

## 26. Ideas esenciales para estudiar

1. La incertidumbre aparece cuando un agente no tiene información completa o segura.
2. La lógica clásica no alcanza para expresar grados de certeza.
3. La probabilidad permite representar creencias parciales.
4. La probabilidad conjunta contiene toda la información, pero crece exponencialmente.
5. La marginalización permite obtener probabilidades de variables específicas sumando los casos restantes.
6. La probabilidad condicional actualiza la creencia al conocer evidencia.
7. El Teorema de Bayes permite razonar de efectos a causas.
8. La independencia condicional permite ignorar información irrelevante dado cierto contexto.
9. Las redes bayesianas representan dependencias e independencias mediante grafos dirigidos acíclicos.
10. La factorización de la red reduce la cantidad de probabilidades necesarias.
11. La inferencia causal va de causa a efecto.
12. La inferencia diagnóstica va de efecto a causa.
13. La inferencia intercausal ocurre entre causas alternativas de un mismo efecto.
14. La evidencia incierta debe modelarse con nodos adicionales, normalmente sensores u observaciones.
15. La separación-d permite leer independencias directamente desde el grafo.
16. En poliárboles, la inferencia se simplifica mucho porque hay un solo camino entre nodos.

---

## 27. Errores comunes

### Error 1: Confundir independencia con independencia condicional

Que dos variables sean independientes sin evidencia no significa que sigan siendo independientes al observar otra variable.

Ejemplo: en un colisionador `X → Y ← Z`, `X` y `Z` pueden ser independientes al inicio, pero se vuelven dependientes si se observa `Y`.

### Error 2: Tratar evidencia incierta como evidencia segura

Si un sensor dice que algo ocurrió, eso no significa necesariamente que ocurrió. Se debe modelar el sensor como un nodo adicional.

### Error 3: Olvidar normalizar

En inferencia con Bayes, muchas veces se calcula:

```text
P(Q | E) = k · P(E | Q)P(Q)
```

El valor `k` asegura que las probabilidades finales sumen 1.

### Error 4: Pensar que una flecha siempre significa causalidad estricta

En redes bayesianas, una flecha representa influencia directa o dependencia probabilística. A veces se interpreta causalmente, pero lo esencial es la estructura de dependencia.

### Error 5: Creer que una red bayesiana elimina la incertidumbre

La red no elimina la incertidumbre. La organiza y permite calcular con ella.

---

## 28. Glosario breve

| Término | Definición |
|---|---|
| Incertidumbre | Falta de información completa o segura para razonar o decidir. |
| Variable aleatoria | Representa una característica del dominio con valores posibles. |
| Probabilidad conjunta | Probabilidad de que varias variables tomen valores específicos al mismo tiempo. |
| Probabilidad marginal | Probabilidad de una variable, obtenida sumando sobre las demás. |
| Probabilidad condicional | Probabilidad de un evento dado que otro se conoce. |
| Evidencia | Información observada o conocida. |
| Inferencia probabilística | Cálculo de probabilidades de consulta dada una evidencia. |
| Independencia condicional | Situación en la que una variable no aporta más información si ya se conoce otra. |
| Red bayesiana | Grafo dirigido acíclico con variables aleatorias y tablas de probabilidad condicional. |
| Padres | Nodos que apuntan directamente hacia un nodo. |
| Descendientes | Nodos que dependen directa o indirectamente de otro. |
| TPC | Tabla de Probabilidad Condicional. |
| Separación-d | Criterio gráfico para identificar independencias condicionales. |
| Poliárbol | Red bayesiana con máximo un camino no dirigido entre cada par de nodos. |
| Apoyo causal | Evidencia ubicada en causas o antecesores. |
| Apoyo evidencial | Evidencia ubicada en efectos o descendientes. |
| Inferencia intercausal | Razonamiento entre causas alternativas de un mismo efecto. |

---

## 29. Resumen final

El razonamiento con incertidumbre permite que un agente actúe cuando no posee información completa. La probabilidad se usa para expresar grados de creencia y actualizar conclusiones a partir de evidencia. Aunque una tabla completa de probabilidades conjuntas permite calcular cualquier consulta, se vuelve intratable cuando hay muchas variables.

Las redes bayesianas solucionan parte de este problema al representar relaciones de dependencia mediante un grafo dirigido acíclico. Cada nodo depende directamente solo de sus padres, y esta estructura permite factorizar la probabilidad conjunta como producto de probabilidades condicionales locales.

Los tres patrones más importantes de inferencia son: causal, diagnóstico e intercausal. Además, la separación-d permite identificar cuándo una evidencia bloquea o activa caminos de dependencia. En redes especiales como los poliárboles, la inferencia puede realizarse de forma más eficiente mediante apoyo causal, evidencial o combinado.

En conjunto, los dos archivos muestran que el razonamiento probabilístico es una alternativa poderosa frente a la lógica clásica cuando el conocimiento es incierto, incompleto o dependiente de observaciones imperfectas.

---

# Resumen didáctico de Procesamiento de Lenguaje Natural (PLN / NLP)

**Tema:** Procesamiento de Lenguaje Natural - Inteligencia Artificial II  
**Objetivo de este resumen:** entender el tema de forma progresiva, sin perder los conceptos técnicos importantes.  
**Referencia base:** informe proporcionado sobre Procesamiento de Lenguaje Natural.

---

## 0. Idea central del tema

El **Procesamiento de Lenguaje Natural**, también llamado **PLN** o **NLP** por sus siglas en inglés (*Natural Language Processing*), es el área de la Inteligencia Artificial que busca que una computadora pueda trabajar con el lenguaje humano.

En palabras simples:

> El PLN intenta que una máquina pueda leer, interpretar, clasificar, responder o generar lenguaje humano de forma útil.

Por ejemplo, si un estudiante escribe:

> "No puedo subir mi tarea porque el sistema falló".

Una persona entiende rápidamente que hay un problema técnico. Para una computadora, en cambio, eso implica varios pasos: reconocer palabras, interpretar el contexto, detectar la intención del mensaje y decidir una acción. Un sistema de PLN podría clasificar ese mensaje como **reclamo técnico** y enviarlo al área correspondiente.

El PLN es importante porque gran parte de la información humana está escrita o hablada en lenguaje natural: mensajes, informes, correos, artículos, redes sociales, chats, transcripciones de voz, formularios y opiniones.

---

## 1. ¿Qué analiza realmente el PLN?

El lenguaje no es solamente una lista de palabras. Tiene varios niveles. Para entender una oración, un sistema debe analizar desde la forma de las palabras hasta la intención del hablante.

| Nivel | Qué analiza | Ejemplo sencillo |
|---|---|---|
| **Fonológico** | Sonidos del habla | Pasar un audio de "examen final" a texto. |
| **Morfológico** | Forma interna de las palabras | Reconocer que "estudié", "estudiando" y "estudiar" pertenecen al mismo verbo. |
| **Sintáctico** | Estructura de la oración | Distinguir sujeto, verbo y complemento en "La docente revisó los informes". |
| **Semántico** | Significado | Entender que "aprobar la materia" significa superar una asignatura. |
| **Pragmático** | Intención según contexto | Interpretar "¿Puede repetir eso?" como una petición, no solo como una pregunta. |
| **Discursivo** | Relación entre oraciones | Saber que en "María entregó el proyecto. Ella recibió buena nota", "Ella" se refiere a María. |

### Idea didáctica

Puede imaginar el PLN como una escalera:

```text
Sonidos -> Palabras -> Oraciones -> Significado -> Intención -> Texto completo
```

Si el sistema falla en un nivel bajo, puede fallar en todo lo demás. Por ejemplo, si ignora la palabra **"no"** en "no aprobé", puede interpretar exactamente lo contrario.

---

## 2. Lenguaje natural vs. lenguaje formal

El **lenguaje natural** es el que usamos todos los días: español, inglés, quechua, mensajes de WhatsApp, informes, conversaciones y correos.

Características del lenguaje natural:

- Es flexible.
- Depende del contexto.
- Permite frases incompletas.
- Puede tener ironía, doble sentido y abreviaciones.
- Una misma palabra puede tener distintos significados.

El **lenguaje formal**, en cambio, tiene reglas estrictas. Por ejemplo, un lenguaje de programación. Una instrucción como:

```text
if nota >= 51 then aprobado
```

es clara porque tiene una estructura exacta. Pero una frase como:

> "Creo que me fue más o menos en el examen".

puede significar duda, preocupación, conformidad o una evaluación regular. Todo depende del contexto.

### Diferencia principal

| Lenguaje formal | Lenguaje natural |
|---|---|
| Reglas exactas | Reglas flexibles |
| Poco ambiguo | Muy ambiguo |
| Fácil de validar sintácticamente | Difícil de interpretar completamente |
| Ejemplo: código | Ejemplo: conversación humana |

---

## 3. La jerarquía de Chomsky como marco teórico

La jerarquía de Chomsky clasifica gramáticas formales según el tipo de lenguaje que pueden describir. En PLN sirve para entender que no todos los problemas lingüísticos tienen la misma dificultad computacional.

| Tipo de gramática | Qué puede modelar | Ejemplo relacionado con PLN |
|---|---|---|
| **Regulares** | Patrones simples | Detectar correos, números de matrícula, formatos. |
| **Libres de contexto** | Estructuras de oración | "Sujeto + verbo + complemento". |
| **Dependientes del contexto** | Relaciones más complejas | Concordancia de género y número en frases largas. |
| **Irrestrictas** | Lenguajes muy generales | Tienen mucho poder, pero son difíciles de procesar eficientemente. |

### Lo importante

Las gramáticas ayudan a describir la estructura del lenguaje, pero no resuelven todo. Para interpretar una frase como:

> "El banco está cerrado".

la gramática puede decir que hay sujeto y predicado, pero no decide si **banco** significa una entidad financiera o un asiento. Para eso se necesita contexto, datos y probabilidad.

---

## 4. Formalización básica de una tarea de PLN

Muchas tareas de PLN se pueden ver como un problema de decisión:

> Dado un texto de entrada, el modelo debe escoger la salida más probable.

La fórmula del informe es:

```math
\hat{y} = \arg\max_{y \in Y} P(y \mid x; \theta)
```

Leída en palabras simples:

> Entre todas las respuestas posibles, el modelo elige la que considera más probable para el texto recibido.

| Símbolo | Significado | Ejemplo |
|---|---|---|
| `x` | Texto de entrada | "La clase fue clara y útil" |
| `Y` | Conjunto de posibles salidas | positivo, negativo, neutro |
| `P(y | x; θ)` | Probabilidad de una salida dado el texto | P(positivo | comentario) |
| `argmax` | Escoger la opción con mayor valor | elegir "positivo" si tiene mayor probabilidad |
| `ŷ` | Respuesta final del modelo | positivo |

### Ejemplo didáctico

Comentario:

> "No entendí la explicación y faltaron ejemplos".

El sistema podría calcular:

| Etiqueta | Probabilidad |
|---|---:|
| Positivo | 0.05 |
| Neutro | 0.20 |
| Negativo | 0.75 |

Entonces elige **negativo** porque tiene la probabilidad más alta.

### Punto clave

En PLN casi nunca hay una única respuesta perfecta. Dos personas pueden interpretar distinto un mismo texto. Por eso los modelos trabajan con **probabilidades**.

---

# PARTE I: PROBLEMAS DEL LENGUAJE NATURAL

---

## 5. ¿Por qué el lenguaje natural es difícil?

El lenguaje humano es difícil para una computadora porque no funciona como una instrucción exacta. Las personas usamos contexto, conocimiento del mundo, intención, memoria y experiencia.

Una máquina recibe datos: caracteres, palabras, sonidos o vectores. El trabajo del PLN es transformar esos datos en interpretaciones útiles.

Ejemplo:

> "La plataforma se cayó antes de subir la tarea".

Una persona entiende que la plataforma virtual dejó de funcionar. La computadora podría interpretar literalmente que una plataforma física cayó al suelo si no entiende el contexto.

Los problemas principales son:

1. Ambigüedad.
2. Variabilidad morfológica.
3. Dependencias de largo alcance.
4. Vocabulario abierto.
5. Correferencia.

---

## 6. Ambigüedad: el problema central

La **ambigüedad** aparece cuando una palabra, frase u oración puede tener más de una interpretación válida.

Ejemplo:

> "El banco está lleno".

Puede significar:

1. El banco como entidad financiera está lleno de personas.
2. El banco como asiento está ocupado.

La oración es la misma, pero el significado cambia según el contexto.

---

## 7. Ambigüedad léxica

La ambigüedad léxica ocurre cuando una palabra tiene varios significados.

### Homonimia

Dos palabras distintas tienen la misma forma.

Ejemplo:

- **Banco** = institución financiera.
- **Banco** = asiento.

### Polisemia

Una misma palabra tiene sentidos relacionados.

Ejemplo:

- **Cabeza** = parte del cuerpo.
- **Cabeza** = líder de un grupo.
- **Cabeza** = inicio de una lista.

En contexto universitario:

- "Aprobé la **materia**" = asignatura.
- "La **materia** cambia de estado" = sustancia física.

La tarea de decidir el sentido correcto se llama **desambiguación del sentido de las palabras** o **WSD** (*Word Sense Disambiguation*).

La idea se resume así:

```math
f: V \times C \rightarrow S
```

En palabras:

> Una función recibe una palabra del vocabulario y un contexto; con eso devuelve el sentido correcto.

Ejemplo:

| Palabra | Contexto | Sentido probable |
|---|---|---|
| banco | dinero, cuenta, depósito | institución financiera |
| banco | plaza, madera, sentarse | asiento |

---

## 8. Ambigüedad sintáctica

La ambigüedad sintáctica aparece cuando una oración puede organizarse de más de una forma.

Ejemplo clásico:

> "Vi al estudiante con el telescopio".

Puede significar:

1. Yo usé el telescopio para ver al estudiante.
2. El estudiante tenía el telescopio.

Mismas palabras, distinta estructura.

Esto afecta tareas como:

- Traducción automática.
- Extracción de información.
- Sistemas de respuesta automática.
- Análisis gramatical.

El informe menciona los **números de Catalan** para mostrar que las formas posibles de agrupar una oración crecen muy rápido.

```math
C_n = \frac{1}{n+1}\binom{2n}{n} = \frac{(2n)!}{(n+1)!n!}
```

No hace falta memorizar la fórmula. Lo importante es entender la idea:

> Mientras más larga es una oración, más posibles estructuras puede tener. Por eso no conviene probar todas las interpretaciones de manera ingenua.

---

## 9. Ambigüedad semántica y pragmática

La ambigüedad semántica se relaciona con el significado lógico. La pragmática se relaciona con la intención comunicativa.

Ejemplo:

> "Cada estudiante leyó un artículo".

Puede significar:

1. Todos leyeron el mismo artículo.
2. Cada estudiante leyó un artículo distinto.

En lógica:

```math
\exists a\ \forall e: leyó(e, a)
```

Significa: existe un artículo que todos leyeron.

```math
\forall e\ \exists a: leyó(e, a)
```

Significa: para cada estudiante existe algún artículo que leyó.

### Idea clave

Un pequeño cambio en la interpretación puede cambiar completamente el significado.

---

## 10. Variabilidad morfológica y normalización

Una misma idea puede aparecer escrita de muchas formas.

Ejemplo con el verbo estudiar:

```text
estudié, estudias, estudiando, estudiado, estudiarán
```

Todas están relacionadas con:

```text
estudiar
```

Si el sistema trata cada forma como una palabra totalmente diferente, pierde información. Para evitar eso se usan técnicas de normalización.

### Lematización

Lleva una palabra a su forma de diccionario.

Ejemplo:

```text
estudié, estudiando, estudian -> estudiar
```

### Stemming

Corta sufijos mediante reglas aproximadas.

Ejemplo simplificado:

```text
estudiando -> estudi
estudiarán -> estudi
```

El stemming suele ser más rápido, pero menos preciso.

### Diferencia rápida

| Técnica | Qué hace | Ventaja | Desventaja |
|---|---|---|---|
| Lematización | Busca la forma correcta de diccionario | Más precisa | Más costosa |
| Stemming | Recorta palabras por reglas | Más rápida | Puede generar raíces incorrectas |

---

## 11. Dependencias de largo alcance

En muchas oraciones, palabras importantes están separadas por mucha información intermedia.

Ejemplo:

> "La propuesta que el grupo preparó durante varias semanas y que el docente revisó con detalle fue finalmente aprobada".

El sujeto principal es:

```text
La propuesta
```

El verbo principal es:

```text
fue aprobada
```

Pero entre ambos hay muchas palabras. El sistema debe recordar que quien fue aprobada es **la propuesta**, no el grupo ni el docente.

### Analogía

Imagine que alguien le dice una oración muy larga y usted debe recordar el inicio para entender el final. Eso mismo le pasa a los modelos secuenciales.

En redes recurrentes, este problema se relaciona con el **gradiente que desaparece**. El informe lo representa con una multiplicación de muchos factores:

```math
\frac{\partial L}{\partial h_0} = \frac{\partial L}{\partial h_T}\prod_{t=1}^{T}\frac{\partial h_t}{\partial h_{t-1}}
```

La idea sencilla:

> Si muchos factores pequeños se multiplican, el resultado se vuelve muy pequeño. Entonces la señal de aprendizaje se debilita y el modelo olvida información lejana.

Por eso se desarrollaron arquitecturas como **LSTM**, **GRU** y después **Transformers**.

---

## 12. Dispersión de datos y vocabulario abierto

Ningún sistema puede conocer todas las palabras posibles. Siempre aparecen:

- Nombres nuevos.
- Apellidos.
- Siglas.
- Errores ortográficos.
- Tecnicismos.
- Expresiones recientes.

Este problema se llama **vocabulario abierto** o **OOV** (*Out Of Vocabulary*).

El informe menciona la **ley de Zipf**, que dice que pocas palabras aparecen muchísimo y muchas palabras aparecen muy poco.

```math
f(r) \approx \frac{C}{r^\alpha}
```

Leído de forma simple:

> Palabras como "de", "la" o "que" aparecen muchas veces; palabras técnicas o raras aparecen pocas veces.

Esto dificulta que el modelo aprenda bien palabras poco frecuentes.

### Solución moderna: subpalabras

En lugar de trabajar solo con palabras completas, los modelos pueden dividirlas en partes.

Ejemplo:

```text
reinscripción -> re + inscripción
```

O incluso en fragmentos más pequeños.

Algoritmos relacionados:

- BPE.
- WordPiece.
- SentencePiece.

La ventaja es que el modelo puede manejar palabras nuevas combinando partes conocidas.

---

## 13. Correferencia y seguimiento de entidades

La **correferencia** consiste en detectar cuándo varias expresiones se refieren a la misma entidad.

Ejemplo:

> "María llegó al laboratorio. Ella revisó los resultados. La estudiante presentó el informe".

Aquí:

```text
María = Ella = La estudiante
```

Un sistema que no resuelve esto puede perder información importante.

En textos académicos ocurre mucho:

```text
el grupo, los estudiantes, ellos, el equipo investigador
```

pueden referirse a la misma entidad.

### Idea clave

La correferencia necesita memoria, gramática y contexto.

---

# PARTE II: PIPELINE CLÁSICO DE PLN

---

## 14. ¿Qué es un pipeline de PLN?

Un **pipeline** es una cadena de etapas. Cada etapa recibe la salida de la etapa anterior.

Ejemplo general:

```text
Texto crudo
   ↓
Tokenización
   ↓
Normalización
   ↓
Etiquetado POS
   ↓
Análisis sintáctico
   ↓
Reconocimiento de entidades
   ↓
Tarea final
```

El informe lo presenta como una arquitectura en cascada.

La fórmula general es:

```math
r^{(k)} = f_k(r^{(k-1)}; \theta_k), \quad k = 1, \dots, K
```

Leída fácil:

> La representación de la etapa actual se obtiene aplicando una función a la representación de la etapa anterior.

### Problema principal: propagación de errores

Si la tokenización se equivoca, el error pasa al etiquetado POS, luego al análisis sintáctico y después a la tarea final.

Es como una fila de fichas de dominó:

```text
Error inicial -> error en la siguiente etapa -> error acumulado
```

---

## 15. Tokenización

La **tokenización** divide un texto en unidades llamadas **tokens**.

Ejemplo:

```text
"La clase fue excelente"
```

se convierte en:

```text
["La", "clase", "fue", "excelente"]
```

Formalmente:

```math
\tau = R(T), \quad \tau \in V^n
```

En palabras:

> El texto `T` se procesa con reglas `R` y se transforma en una secuencia de tokens.

### Tipos de tokenización

| Estrategia | Qué hace | Ejemplo |
|---|---|---|
| Por espacios | Separa donde hay espacios | "El gato" -> "El", "gato" |
| Por palabras | Considera palabras completas | "procesó" como una palabra |
| Por caracteres | Cada letra es token | "gato" -> g, a, t, o |
| Por subpalabras | Divide en fragmentos frecuentes | "descodificador" -> des, cod, ific, ador |

La tokenización por subpalabras ayuda con el vocabulario abierto.

---

## 16. Etiquetado POS

El **etiquetado POS** asigna a cada palabra una categoría gramatical.

POS significa *Part Of Speech*.

Ejemplo:

```text
El gato come pescado fresco
```

| Token | Etiqueta POS |
|---|---|
| El | determinante |
| gato | sustantivo |
| come | verbo |
| pescado | sustantivo |
| fresco | adjetivo |

El informe presenta una formulación basada en HMM:

```math
\hat{t} = \arg\max_t \prod_{i=1}^{n} P(w_i \mid t_i) \cdot P(t_i \mid t_{i-1})
```

Leído fácil:

> El sistema busca la secuencia de etiquetas más probable considerando qué palabra aparece con cada etiqueta y qué etiqueta suele seguir a otra.

---

## 17. Análisis de dependencias

El análisis de dependencias construye un árbol que muestra qué palabra depende de cuál.

Ejemplo:

```text
El gato come el pescado fresco
```

Una interpretación posible:

```text
come
├── gato       (sujeto)
│   └── El     (determinante)
└── pescado    (objeto)
    ├── el     (determinante)
    └── fresco (adjetivo)
```

### Idea clave

No basta con saber qué palabras hay. También importa cómo se relacionan.

---

## 18. Pipeline clásico vs. extremo a extremo

| Aspecto | Pipeline clásico | Modelo extremo a extremo |
|---|---|---|
| Cómo trabaja | Por etapas separadas | Aprende todo junto |
| Interpretabilidad | Alta | Baja |
| Propagación de errores | Alta | Menor |
| Datos requeridos | Anotaciones por nivel | Grandes datos de preentrenamiento |
| Adaptación a nuevas tareas | Requiere rediseño | Puede ajustarse con fine-tuning |
| Rendimiento moderno | Moderado | Estado del arte |

### En simple

El pipeline clásico es más transparente: se puede ver qué hizo cada etapa. Los modelos modernos son más potentes, pero menos fáciles de interpretar.

---

# PARTE III: REPRESENTACIÓN MATEMÁTICA DEL LENGUAJE

---

## 19. ¿Por qué hay que representar palabras como números?

Las computadoras no entienden palabras directamente. Necesitan números.

Por eso, el PLN convierte texto en representaciones matemáticas.

Ejemplo:

```text
"excelente" -> (0.82, 0.11, 0.65)
```

La pregunta es:

> ¿Cómo convertimos palabras, frases o documentos en números sin perder demasiado significado?

---

## 20. Bag of Words (BoW)

**Bag of Words** representa un documento contando cuántas veces aparece cada palabra.

Si el vocabulario es:

```text
[clase, examen, difícil, buena]
```

Y el documento es:

```text
"clase buena buena"
```

Entonces el vector podría ser:

```text
[1, 0, 0, 2]
```

porque:

- clase aparece 1 vez.
- examen aparece 0 veces.
- difícil aparece 0 veces.
- buena aparece 2 veces.

Formalmente:

```math
[x_d]_i = count(v_i, d)
```

### Ventaja

Es simple y rápido.

### Desventajas

- Ignora el orden de las palabras.
- No entiende significado.
- Genera vectores muy grandes y dispersos.
- Trata sinónimos como palabras totalmente diferentes.

Ejemplo:

```text
rey y monarca
```

pueden tener significados cercanos, pero BoW los ve como posiciones distintas sin relación.

---

## 21. TF-IDF

**TF-IDF** mejora Bag of Words dando más peso a palabras importantes y menos peso a palabras demasiado comunes.

Se compone de dos partes:

### TF: frecuencia del término

Mide cuántas veces aparece una palabra en un documento.

```math
TF(t,d) = 1 + \log(count(t,d))
```

si la palabra aparece.

### IDF: frecuencia inversa de documento

Mide qué tan especial es una palabra en el corpus.

```math
IDF(t,D) = \log\left(\frac{N+1}{|\{d \in D: t \in d\}|+1}\right)+1
```

### Peso final

```math
w(t,d) = TF(t,d) \times IDF(t,D)
```

### Idea didáctica

Una palabra es importante si:

1. aparece bastante en un documento, y
2. no aparece en todos los documentos.

Ejemplo:

| Palabra | Aparece mucho en el documento | Aparece en todos los documentos | Peso probable |
|---|---|---|---|
| el | sí | sí | bajo |
| algoritmo | sí | no | alto |
| de | sí | sí | bajo |
| aprendizaje | moderado | no tanto | medio |

---

## 22. Word Embeddings

Los **word embeddings** representan palabras como vectores densos de baja dimensión.

A diferencia de BoW y TF-IDF, intentan capturar relaciones semánticas.

La hipótesis principal es la **hipótesis distribucional**:

> Palabras que aparecen en contextos similares tienden a tener significados similares.

Ejemplo:

```text
gato, perro, mascota
```

probablemente aparecerán en contextos parecidos y sus vectores estarán cerca.

### Comparación visual

```text
BoW / TF-IDF:
- vectores grandes
- muchos ceros
- poca semántica

Embeddings:
- vectores pequeños
- números decimales
- capturan similitud
```

---

## 23. Word2Vec: Skip-gram

El modelo **Skip-gram** de Word2Vec aprende tratando de predecir palabras de contexto a partir de una palabra central.

Ejemplo:

```text
"El gato come pescado"
```

Si la palabra central es:

```text
gato
```

el modelo intenta predecir palabras cercanas como:

```text
El, come
```

La fórmula del informe es:

```math
P(w_c \mid w_t) = \frac{\exp(e'_{w_c}{}^T e_{w_t})}{\sum_{v \in V}\exp(e'_v{}^T e_{w_t})}
```

Leída fácil:

> El modelo calcula qué tan probable es una palabra de contexto dada una palabra central.

El problema es que calcular sobre todo el vocabulario puede ser costoso. Por eso se usan técnicas como:

- **Negative sampling**.
- **Hierarchical softmax**.

---

## 24. GloVe

**GloVe** aprende embeddings usando una matriz global de co-ocurrencias.

Mientras Word2Vec aprende mirando ventanas locales, GloVe observa estadísticas globales: qué palabras aparecen juntas en todo el corpus.

La idea sencilla:

> Si dos palabras aparecen frecuentemente cerca de las mismas palabras, sus vectores deberían estar relacionados.

---

## 25. Analogías lineales en embeddings

Una propiedad interesante de los embeddings es que algunas relaciones semánticas pueden representarse con operaciones vectoriales.

Ejemplo del informe:

```math
e_{rey} - e_{hombre} + e_{mujer} \approx e_{reina}
```

En palabras:

> Si a "rey" le quitamos la idea de "hombre" y le agregamos la idea de "mujer", obtenemos algo cercano a "reina".

Esto muestra que los embeddings pueden capturar relaciones como género, capital-país, singular-plural, entre otras.

---

## 26. Limitación de embeddings estáticos

Word2Vec y GloVe asignan un solo vector a cada palabra.

Problema:

```text
banco financiero
banco de plaza
```

La palabra **banco** tendría el mismo vector, aunque el significado cambie.

Por eso aparecen los **embeddings contextuales**, donde el vector de una palabra cambia según la oración en la que aparece.

Ejemplo:

| Oración | Vector de "banco" debería representar |
|---|---|
| "Deposité dinero en el banco" | entidad financiera |
| "Me senté en el banco" | asiento |

Modelos modernos como BERT y GPT usan representaciones contextuales.

---

## 27. Comparación de representaciones

| Propiedad | BoW | TF-IDF | Word2Vec / GloVe | Contextuales |
|---|---|---|---|---|
| Dimensión | Muy alta | Muy alta | Menor | Media/alta |
| Tipo de vector | Disperso | Disperso | Denso | Denso |
| Considera orden | No | No | Ventana local | Secuencia completa |
| Captura semántica | No | Poco | Sí | Sí, con contexto |
| Maneja polisemia | No | No | No | Sí, mejor |
| Costo | Bajo | Bajo | Moderado | Alto |

---

# PARTE IV: MODELOS CLÁSICOS DE PLN

---

## 28. Del enfoque de reglas al enfoque estadístico

Antes, muchos sistemas de PLN se basaban en reglas escritas manualmente por expertos.

Problema:

> El lenguaje tiene demasiadas excepciones. Es imposible escribir reglas para todos los casos.

El enfoque estadístico cambia la idea:

> En lugar de escribir todas las reglas, se dan muchos ejemplos al sistema para que aprenda patrones.

Modelos clásicos importantes:

1. Naive Bayes.
2. HMM.
3. CRF.

---

## 29. Naive Bayes

**Naive Bayes** es un clasificador simple usado en tareas como:

- Detección de spam.
- Análisis de sentimiento.
- Clasificación temática.

Ejemplo:

Si un correo contiene palabras como:

```text
gratis, oferta, clic, premio
```

el modelo puede asignar alta probabilidad a la clase **spam**.

### Supuesto principal

Naive Bayes asume independencia condicional de las palabras dada la clase.

En simple:

> Actúa como si cada palabra aportara información por separado, sin depender de las otras.

Esto no es totalmente realista, pero funciona sorprendentemente bien en muchos casos.

### Problema de probabilidad cero

Si una palabra nunca apareció en entrenamiento, puede recibir probabilidad cero y arruinar el cálculo completo.

Solución:

> **Suavizado de Laplace**, que agrega un pequeño valor para evitar probabilidades cero.

---

## 30. Modelos Ocultos de Markov (HMM)

Naive Bayes ignora el orden de las palabras. Pero en lenguaje, el orden importa.

Ejemplo:

```text
El perro muerde al hombre.
El hombre muerde al perro.
```

Tienen las mismas palabras principales, pero distinto significado.

Los **HMM** modelan secuencias. Usan:

- Estados ocultos.
- Observaciones.
- Probabilidades de transición.
- Probabilidades de emisión.
- Distribución inicial.

### Ejemplo intuitivo

En etiquetado POS:

- Observaciones = palabras visibles.
- Estados ocultos = etiquetas gramaticales.

```text
Palabras:   El      gato     come
Estados:    DET     SUST     VERBO
```

### Tres problemas principales en HMM

| Problema | Pregunta | Algoritmo |
|---|---|---|
| Evaluación | ¿Qué tan probable es esta oración? | Forward |
| Decodificación | ¿Cuál es la secuencia de etiquetas más probable? | Viterbi |
| Aprendizaje | ¿Cómo ajustar parámetros con datos? | Baum-Welch |

### Limitación

Un HMM mira principalmente dependencias locales. Puede ser insuficiente para capturar contexto amplio.

---

## 31. CRF: Campos Aleatorios Condicionales

Un **CRF** es un modelo de secuencias que predice etiquetas considerando más contexto.

A diferencia del HMM, no intenta generar las palabras. Modela directamente:

```math
P(y \mid x)
```

Es decir:

> La probabilidad de una secuencia de etiquetas dada una secuencia de palabras.

### Ejemplo: reconocimiento de entidades

Oración:

```text
La OMS anunció un informe
```

Etiquetas posibles:

```text
La      -> O
OMS     -> B-ORG
anunció -> O
un      -> O
informe -> O
```

El CRF puede usar características como:

- Si una palabra está en mayúsculas.
- Si termina con cierto sufijo.
- Qué palabra viene antes.
- Qué palabra viene después.
- Si parece nombre de organización.

### Diferencia con HMM

| HMM | CRF |
|---|---|
| Modelo generativo | Modelo discriminativo |
| Modela cómo se generan palabras | Modela etiquetas dadas las palabras |
| Contexto más limitado | Puede usar contexto global |
| Útil para POS y habla | Muy útil para NER y etiquetado |

---

## 32. Comparación de modelos clásicos

| Modelo | Tipo | Salida | Usa contexto global | Aplicaciones |
|---|---|---|---|---|
| Naive Bayes | Generativo | Clase | No | Spam, sentimiento |
| HMM | Generativo | Secuencia | No completamente | POS, habla |
| CRF | Discriminativo | Secuencia | Sí | NER, POS |

### Evolución conceptual

```text
Naive Bayes -> ignora orden
HMM -> considera secuencia
CRF -> considera secuencia y más contexto
```

Limitación común:

> Requieren que un humano defina características importantes.

Esa limitación motiva el uso de deep learning.

---

# PARTE V: DEEP LEARNING EN PLN

---

## 33. Cambio de paradigma

Los modelos clásicos necesitan que una persona defina características manualmente.

Ejemplo:

```text
¿La palabra empieza con mayúscula?
¿Tiene cierto sufijo?
¿Aparece después de un verbo?
```

El **deep learning** intenta que el modelo aprenda esas características automáticamente a partir de muchos ejemplos.

### Idea central

> En lugar de decirle al sistema qué buscar, se le dan datos y la red aprende patrones útiles.

---

## 34. Redes Neuronales Recurrentes (RNN)

Una **RNN** procesa texto palabra por palabra. Después de leer cada palabra, actualiza una memoria interna.

Ejemplo:

```text
El -> gato -> come -> pescado
```

La RNN va leyendo en orden:

```text
palabra actual + memoria anterior -> nueva memoria
```

### Analogía

Es como leer una oración manteniendo en la cabeza lo que ya se leyó.

### Problema

En textos largos, la RNN tiende a olvidar información del inicio. Esto se relaciona con el gradiente que desaparece.

---

## 35. LSTM

La **LSTM** fue diseñada para mejorar la memoria de las RNN.

Introduce una memoria explícita `c_t` y compuertas que controlan qué información entra, se olvida o sale.

Fórmulas del informe:

```math
c_t = f_t \odot c_{t-1} + i_t \odot \tilde{c}_t
```

```math
h_t = o_t \odot \tanh(c_t)
```

Leído fácil:

- `f_t` decide qué olvidar.
- `i_t` decide qué información nueva guardar.
- `o_t` decide qué mostrar como salida.
- `c_t` es la memoria.
- `h_t` es el estado oculto o salida de la celda.

### Analogía

Una LSTM es como una libreta con tres controles:

1. Qué borrar.
2. Qué escribir.
3. Qué leer.

---

## 36. GRU

La **GRU** es una versión más simple de la LSTM.

Usa menos compuertas:

- Compuerta de actualización.
- Compuerta de reinicio.

### Ventaja

Es más rápida y tiene menos parámetros.

### Diferencia rápida

| Arquitectura | Memoria | Parámetros | Manejo de largo plazo |
|---|---|---|---|
| RNN | No explícita | Bajo | Limitado |
| LSTM | Explícita | Alto | Alto |
| GRU | Parcial | Medio | Medio-alto |

---

## 37. Limitación de RNN, LSTM y GRU

Aunque LSTM y GRU mejoran la memoria, siguen leyendo palabra por palabra.

Problema:

> No pueden procesar todas las palabras en paralelo de forma natural.

Esto hace que sean más lentas en secuencias largas.

Esa limitación motivó los mecanismos de atención y luego los **Transformers**.

---

# PARTE VI: ATENCIÓN, TRANSFORMERS Y LLMs

---

## 38. De tokens a vectores

Antes de llegar a Transformers, el informe presenta tres pasos básicos:

1. Tokenización.
2. One Hot Encoding.
3. Embeddings.

### Tokenización

Divide el texto en tokens.

```text
El gato come su comida
```

```text
[El, gato, come, su, comida]
```

### One Hot Encoding

Representa cada token como un vector con muchos ceros y un solo uno.

Ejemplo simplificado:

```text
gato -> [0, 1, 0, 0, 0]
come -> [0, 0, 1, 0, 0]
```

Ventaja: cada palabra queda representada de forma única.  
Desventaja: los vectores son enormes y no capturan significado.

### Embedding

Convierte esos vectores grandes y dispersos en vectores más pequeños y densos.

Ejemplo:

```text
gato -> [0.97, 0.05, 0.38, 0.72]
come -> [0.89, 0.11, 0.42, 0.63]
```

Ahora las distancias entre vectores pueden representar similitud semántica.

---

## 39. ¿Qué es la atención?

La **atención** permite que el modelo decida qué palabras son más importantes para interpretar otra palabra.

Ejemplo:

```text
El gato come su comida
```

Para entender **El**, puede ser importante mirar **gato**.  
Para entender **gato**, puede ser importante mirar **come**.  
Para entender **su**, puede ser importante saber de quién se habla.

### Idea simple

> Atención significa asignar importancia a unas palabras respecto de otras.

---

## 40. Query, Key y Value

El informe explica la atención usando vectores **key**, **query** y **value**.

Puede entenderlos así:

| Vector | Pregunta intuitiva | Función |
|---|---|---|
| Query | ¿Qué estoy buscando? | Representa la necesidad de información de una palabra. |
| Key | ¿Qué información ofrezco? | Permite comparar si otra palabra es relevante. |
| Value | ¿Qué contenido entrego si soy relevante? | Información que se transmite. |

### Analogía de biblioteca

Imagine que usted busca un libro:

- **Query** = su consulta: "libros de inteligencia artificial".
- **Key** = etiquetas de los libros: "IA", "lenguaje", "redes".
- **Value** = el contenido del libro que realmente se consulta.

La atención compara la consulta con las etiquetas y luego usa el contenido de lo más relevante.

---

## 41. Producto punto y puntuación de atención

El informe presenta la relación entre query y key mediante producto punto:

```math
\vec{v}_{key} \cdot \vec{v}_{query} = \vec{v}_{atención}
```

Didácticamente, puede entenderse como una puntuación:

> Si el producto entre query y key es alto, esas palabras están más relacionadas para esa tarea.

Ejemplo conceptual:

| Palabra analizada | Palabra comparada | Puntuación de atención |
|---|---|---:|
| El | gato | 0.89 |
| El | come | 0.54 |
| El | comida | 0.23 |

La mayor atención se da a **gato**.

---

## 42. Matriz de atención

Cuando se comparan todas las palabras con todas, se obtiene una **matriz de atención**.

Ejemplo conceptual:

| | El | gato | come | comida |
|---|---:|---:|---:|---:|
| El | 0.20 | 0.89 | 0.40 | 0.10 |
| gato | 0.30 | 0.10 | 0.93 | 0.20 |
| come | 0.10 | 0.80 | 0.20 | 0.85 |
| comida | 0.10 | 0.35 | 0.70 | 0.20 |

Cada fila puede verse como:

> Para entender esta palabra, ¿a qué otras palabras debo mirar más?

---

## 43. ¿Por qué aparecen los Transformers?

Las RNN procesan palabra por palabra. Aunque se agregue atención, el procesamiento secuencial puede ser lento y puede perder información.

El Transformer cambia la idea:

> En lugar de leer una palabra tras otra, procesa muchas posiciones en paralelo usando atención.

Esto permite:

- Capturar relaciones lejanas.
- Entrenar más rápido.
- Usar mejor grandes cantidades de datos.
- Construir modelos de lenguaje grandes.

---

## 44. Vectores de posición

Si el Transformer procesa palabras en paralelo, necesita saber el orden.

Ejemplo:

```text
El perro mordió al hombre.
El hombre mordió al perro.
```

Las palabras son parecidas, pero el orden cambia el significado.

Por eso se agregan **vectores de posición**.

El informe presenta codificación posicional basada en seno y coseno:

```math
PE(pos,2i) = \sin(pos / 10000^{2i/d_{model}})
```

```math
PE(pos,2i+1) = \cos(pos / 10000^{2i/d_{model}})
```

Leído fácil:

> A cada posición del texto se le agrega una marca matemática para que el modelo sepa dónde está cada token.

### Idea clave

Sin información de posición, el modelo tendría dificultad para distinguir:

```text
Juan llamó a Pedro
Pedro llamó a Juan
```

---

## 45. Arquitectura Transformer: encoder y decoder

El informe resume el Transformer con dos partes principales:

### Encoder

Lee y representa el texto de entrada.

Componentes:

- Embeddings + posición.
- Self-attention.
- Red feedforward.
- Normalización y conexiones residuales.

### Decoder

Genera la salida.

Componentes:

- Self-attention enmascarada.
- Atención cruzada con el encoder.
- Red feedforward.

### Esquema simple

```text
Entrada
  ↓
Embeddings + Posición
  ↓
Self-Attention
  ↓
Feedforward
  ↓
Salida del Encoder

Decoder:
Salida parcial anterior
  ↓
Self-Attention enmascarada
  ↓
Atención cruzada con Encoder
  ↓
Feedforward
  ↓
Siguiente token
```

---

## 46. Self-attention, masked attention y cross-attention

### Self-attention

Cada palabra mira a las demás palabras de la misma secuencia.

Ejemplo:

```text
"Ella entregó su informe"
```

Para interpretar **su**, el modelo puede mirar **Ella** e **informe**.

### Masked self-attention

Se usa en el decoder para impedir mirar palabras futuras.

Ejemplo al generar:

```text
La clase fue ___
```

El modelo no debería ver la respuesta futura antes de generarla.

### Cross-attention

El decoder mira la salida del encoder.

Ejemplo en traducción:

- Encoder lee la oración en inglés.
- Decoder genera la traducción en español.
- Cross-attention ayuda a alinear lo que se genera con lo que se leyó.

---

## 47. RNN vs Transformer

| Propiedad | RNN | Transformer |
|---|---|---|
| Procesamiento | Secuencial | Paralelo por posiciones |
| Dependencias largas | Limitadas | Mejores |
| Memoria contextual | Implícita | Más explícita mediante atención |
| Velocidad de entrenamiento | Menor | Mayor en hardware paralelo |
| Complejidad por capa | O(n) | O(n²) |
| Problema principal | Olvido / lentitud | Costo cuadrático en secuencias largas |

### En simple

La RNN lee como una persona que sigue palabra por palabra.  
El Transformer observa muchas relaciones a la vez.

---

## 48. LLMs: modelos grandes de lenguaje

Los **LLMs** (*Large Language Models*) son modelos grandes basados principalmente en Transformers.

Se entrenan con grandes cantidades de texto para aprender patrones del lenguaje.

En modelos autoregresivos, el objetivo es predecir el siguiente token usando los anteriores.

Fórmula del informe:

```math
P(x_{1:T}) = \prod_{t=1}^{T} P(x_t \mid x_{<t})
```

Leído fácil:

> La probabilidad de una secuencia se calcula multiplicando la probabilidad de cada token dado lo anterior.

Función de pérdida:

```math
L_{LM} = -\sum_{t=1}^{T}\log P(x_t \mid x_{<t})
```

En palabras:

> El modelo es penalizado cuando asigna baja probabilidad al token correcto.

### Preentrenamiento y adaptación

1. **Preentrenamiento:** el modelo aprende patrones generales del lenguaje.
2. **Adaptación o fine-tuning:** se ajusta a una tarea específica.

---

# PARTE VII: SUBÁREAS DEL PLN

---

## 49. Subáreas principales

El informe presenta varias subáreas del PLN. Todas buscan comprender o generar lenguaje, pero cada una se enfoca en un problema distinto.

| Subárea | Qué hace | Ejemplo |
|---|---|---|
| Representación del lenguaje | Convierte texto en estructuras computables | Embeddings |
| Modelado del lenguaje | Predice palabras o secuencias | Autocompletado |
| Clasificación de texto | Asigna categorías | Spam / no spam |
| Extracción de información | Convierte texto no estructurado en datos | Detectar nombres, fechas, lugares |
| Recuperación de información | Busca documentos relevantes | Motor de búsqueda |
| Sistemas de diálogo | Mantiene conversaciones | Chatbots |
| Análisis de sentimiento | Detecta opinión o emoción | Comentario positivo/negativo |
| Resumen automático | Reduce texto conservando lo importante | Resumen de un artículo |
| Traducción automática | Traduce entre idiomas | Inglés a español |
| Generación de texto | Produce contenido nuevo | Redacción automática |

---

## 50. Cómo se conectan las subáreas

Puede verlas así:

```text
Representación del lenguaje
        ↓
Modelado del lenguaje
        ↓
Aplicaciones:
- clasificación
- resumen
- traducción
- diálogo
- sentimiento
- generación
```

La representación es la base. Si el texto está mal representado, los modelos posteriores tienen más dificultad para aprender.

---

# PARTE VIII: EJEMPLO COMPLETO - ANÁLISIS DE SENTIMIENTO

---

## 51. ¿Qué es el análisis de sentimiento?

El **análisis de sentimiento** busca identificar la opinión o emoción presente en un texto.

Categorías comunes:

```text
positivo | negativo | neutral
```

Ejemplo:

```text
"La plataforma funciona muy bien y es fácil de usar"
```

Clasificación probable:

```text
positivo
```

Ejemplo negativo:

```text
"El servicio fue lento y frustrante"
```

Clasificación probable:

```text
negativo
```

---

## 52. Pipeline para análisis de sentimiento

Un sistema básico puede seguir este flujo:

```text
Texto
  ↓
Preprocesamiento
  ↓
Tokenización
  ↓
Representación vectorial
  ↓
Modelo de clasificación
  ↓
Etiqueta final
```

Ejemplo:

```text
"EXCELENTE!!!"
```

Preprocesamiento:

```text
"excelente"
```

Tokenización:

```text
["excelente"]
```

Representación:

```text
excelente -> vector numérico
```

Clasificación:

```text
positivo
```

---

## 53. Representación vectorial en análisis de sentimiento

El texto debe transformarse en números.

Ejemplo:

```text
"excelente" -> (0.82, 0.11, 0.65)
```

La idea es que palabras similares tengan vectores cercanos.

```text
excelente ≈ muy bueno
terrible ≈ malo
```

---

## 54. Clasificación con softmax

El informe presenta softmax para calcular probabilidades por clase:

```math
P(y=k \mid d) = \frac{\exp(w_k^T z_d)}{\sum_j \exp(w_j^T z_d)}
```

En palabras:

> El modelo calcula una puntuación para cada clase y softmax convierte esas puntuaciones en probabilidades.

Ejemplo:

Texto:

```text
"El servicio fue lento y frustrante"
```

| Clase | Probabilidad |
|---|---:|
| Positivo | 0.05 |
| Neutral | 0.10 |
| Negativo | 0.85 |

Resultado:

```text
negativo
```

---

## 55. Importancia del contexto en sentimiento

Ejemplo:

```text
"La clase parecía buena pero el examen fue terrible"
```

Hay una palabra positiva:

```text
buena
```

pero también una negativa muy fuerte:

```text
terrible
```

El sistema debe entender que el sentimiento general puede ser negativo, sobre todo por el contraste introducido por **pero**.

### Regla práctica

Palabras como:

```text
pero, aunque, sin embargo
```

pueden cambiar mucho la interpretación emocional de una oración.

---

## 56. Evaluación del modelo

Después de entrenar, hay que medir qué tan bien funciona.

Una métrica mencionada en el informe es la **precisión**:

```math
Precision = \frac{TP}{TP + FP}
```

Donde:

- `TP` = verdaderos positivos.
- `FP` = falsos positivos.

En palabras:

> La precisión mide qué tan confiables son las predicciones positivas del modelo.

También se suelen usar:

- Recall.
- F1-score.

Para entender el tema sin perderse, estudie en este orden:

   Entienda que el objetivo es hacer que la máquina procese lenguaje humano.

## 60. Explicación final en lenguaje sencillo

El PLN puede entenderse como un proceso de traducción entre dos mundos:

```text
Lenguaje humano -> Representación matemática -> Modelo de IA -> Respuesta útil
```

El problema es que el lenguaje humano es ambiguo y depende del contexto. Por eso, los sistemas de PLN necesitan:

- Separar el texto en unidades.
- Normalizar palabras.
- Representar palabras como números.
- Aprender patrones con modelos.
- Usar contexto para interpretar correctamente.

Los métodos antiguos trabajaban por etapas y con reglas o características manuales. Los métodos modernos, especialmente Transformers y LLMs, aprenden representaciones más profundas usando grandes cantidades de texto y mecanismos de atención.
