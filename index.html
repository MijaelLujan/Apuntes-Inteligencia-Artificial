# Resumen didáctico: Algoritmos Genéticos

> **Objetivo de esta guía:** entender los Algoritmos Genéticos desde cero, con una explicación clara, ordenada y práctica.  
> La idea no es memorizar fórmulas, sino comprender **qué hace cada parte del algoritmo**, **por qué existe** y **cómo se conecta con las demás**.

---

## 1. Idea central del tema

Un **Algoritmo Genético** es una técnica de búsqueda y optimización inspirada en la evolución natural.

En la naturaleza, una población de seres vivos cambia con el tiempo. Algunos individuos tienen características que los hacen más aptos para sobrevivir y reproducirse. Esas características se transmiten, se mezclan y a veces cambian por mutaciones. Con muchas generaciones, la población puede adaptarse mejor a su entorno.

Un Algoritmo Genético hace algo parecido, pero con **soluciones a un problema**.

En lugar de tener animales o plantas, tiene una población de posibles soluciones. En lugar de medir supervivencia, mide qué tan buena es cada solución. En lugar de reproducción biológica, usa operadores como selección, cruzamiento y mutación.

La idea básica es:

```text
Muchas soluciones iniciales
        ↓
Evaluar qué tan buenas son
        ↓
Elegir las mejores con cierta probabilidad
        ↓
Combinarlas y mutarlas
        ↓
Crear una nueva generación
        ↓
Repetir hasta encontrar una buena solución
```

Una frase para recordarlo:

> Un Algoritmo Genético no intenta resolver el problema de golpe; hace que varias soluciones compitan, se mezclen y mejoren generación tras generación.

---

## 2. ¿Para qué sirven los Algoritmos Genéticos?

Sirven principalmente para problemas donde hay muchísimas soluciones posibles y sería muy costoso probarlas todas.

Por ejemplo:

- Buscar la mejor ruta entre varias ciudades.
- Ajustar parámetros de un modelo.
- Elegir combinaciones óptimas.
- Resolver problemas de planificación.
- Optimizar funciones matemáticas.
- Diseñar soluciones cuando no se conoce un método exacto eficiente.

Un método tradicional podría intentar seguir una regla directa o calcular una solución exacta. El Algoritmo Genético, en cambio, trabaja de manera evolutiva: prueba varias soluciones, conserva las mejores y genera nuevas combinaciones.

Esto es útil cuando el espacio de búsqueda es grande, irregular o difícil de recorrer.

---

## 3. Relación entre biología y computación

Los Algoritmos Genéticos toman palabras de la biología, pero las adaptan al mundo computacional.

| Biología | En Algoritmos Genéticos | Explicación sencilla |
|---|---|---|
| Individuo | Solución candidata | Una posible respuesta al problema. |
| Población | Conjunto de soluciones | Varias soluciones que compiten entre sí. |
| Gen | Parte de una solución | Una posición o valor dentro del cromosoma. |
| Cromosoma | Codificación completa de la solución | La estructura de datos que representa una solución. |
| Genotipo | Representación interna | Cómo está codificada la solución. |
| Fenotipo | Solución interpretada | Qué significa esa codificación en el problema real. |
| Aptitud | Fitness | Qué tan buena es la solución. |
| Selección natural | Selección de padres | Las mejores soluciones tienen más probabilidad de reproducirse. |
| Recombinación | Cruzamiento | Mezcla información de dos padres. |
| Mutación | Cambio aleatorio | Introduce pequeñas variaciones. |
| Generación | Iteración evolutiva | Una vuelta completa del ciclo del algoritmo. |

Ejemplo sencillo:

```text
Cromosoma: 10110
```

Ese cromosoma puede ser solo una cadena de bits. Pero al decodificarlo, puede representar un número, una ruta, una selección de objetos o una configuración de parámetros. La misma cadena puede tener significados distintos según el problema.

---

## 4. Fundamentos biológicos que inspiran el algoritmo

### 4.1 Variabilidad

En una población natural, los individuos no son idénticos. Algunos son más rápidos, otros más resistentes, otros más fuertes.

En un Algoritmo Genético pasa lo mismo: la población debe tener soluciones variadas. Si todas las soluciones son iguales, no hay nada nuevo que combinar ni explorar.

**Idea clave:** la diversidad es el combustible de la evolución.

---

### 4.2 Herencia

En biología, ciertas características pasan de padres a hijos.

En un Algoritmo Genético, los hijos reciben partes de los cromosomas de sus padres. Si los padres tienen buenas características, los hijos podrían heredarlas.

Ejemplo:

```text
Padre 1: 11110000
Padre 2: 00001111

Hijo posible: 11111111
```

El hijo puede combinar partes útiles de ambos padres.

---

### 4.3 Selección natural

En la naturaleza, los individuos mejor adaptados tienen más posibilidades de reproducirse.

En un Algoritmo Genético, los individuos con mejor fitness tienen mayor probabilidad de ser elegidos como padres.

Esto no significa que siempre se elija al mejor. También se deja un poco de azar para evitar que el algoritmo se estanque demasiado pronto.

**Idea clave:** los mejores tienen ventaja, pero los peores no siempre desaparecen inmediatamente.

---

### 4.4 Mutación

La mutación introduce cambios aleatorios.

En biología, una mutación puede ser mala, neutra o beneficiosa. En Algoritmos Genéticos ocurre lo mismo: puede empeorar una solución, no afectarla mucho o descubrir una mejora inesperada.

La mutación es importante porque permite explorar regiones nuevas del espacio de búsqueda.

---

## 5. Estructura general de un Algoritmo Genético

Un Algoritmo Genético simple sigue este ciclo:

```text
1. Crear una población inicial.
2. Evaluar cada individuo con la función de fitness.
3. Seleccionar individuos para reproducirse.
4. Aplicar cruzamiento para generar hijos.
5. Aplicar mutación a algunos hijos.
6. Formar la nueva población.
7. Repetir hasta cumplir un criterio de parada.
```

También se puede expresar así:

```text
INICIO
    Crear población inicial
    Evaluar población

    MIENTRAS no se cumpla el criterio de parada:
        Seleccionar padres
        Cruzar padres para crear hijos
        Mutar algunos hijos
        Evaluar hijos
        Reemplazar población anterior
    FIN MIENTRAS

    Devolver la mejor solución encontrada
FIN
```

La esencia es muy simple:

> Evaluar → seleccionar → cruzar → mutar → reemplazar → repetir.

---

## 6. Componentes principales del algoritmo

### 6.1 Población

La población es el conjunto de soluciones candidatas.

Ejemplo:

```text
Individuo 1: 101001
Individuo 2: 111000
Individuo 3: 000111
Individuo 4: 110010
```

Cada individuo representa una posible solución.

Una población pequeña es rápida, pero puede tener poca diversidad. Una población grande explora mejor, pero consume más tiempo y memoria.

En el informe se menciona como referencia práctica trabajar con poblaciones entre **30 y 200 individuos**, aunque esto depende del problema y de la longitud del cromosoma.

---

### 6.2 Individuo o cromosoma

El cromosoma es la estructura de datos que representa una solución.

Puede ser:

```text
Binario:       1010110
Entero:        [3, 7, 2, 9]
Real:          [0.25, 1.80, -3.14]
Permutación:   [4, 2, 1, 3, 5]
Árbol:         una expresión o programa en forma de árbol
Híbrido:       mezcla de varios tipos
```

La representación importa muchísimo porque determina qué tipo de cruce y mutación se pueden aplicar.

---

### 6.3 Gen

Un gen es una parte del cromosoma.

Ejemplo:

```text
Cromosoma: 1 0 1 1 0
           ↑
          gen
```

Cada posición del cromosoma puede representar una característica de la solución.

---

### 6.4 Fitness o función de aptitud

El fitness es una función que mide qué tan buena es una solución.

Por ejemplo, si el problema es maximizar:

```text
f(x) = -x² + 5x + 3
```

Entonces el fitness puede ser directamente el valor de `f(x)`. Cuanto mayor sea `f(x)`, mejor será el individuo.

Si el problema es minimizar, por ejemplo reducir el tiempo de ejecución, se puede transformar la función para que los valores menores se conviertan en mayor fitness.

**La función de fitness es el corazón del algoritmo.**

Si está mal diseñada, el algoritmo puede evolucionar hacia soluciones incorrectas.

Una buena función de fitness debe:

- Diferenciar soluciones buenas y malas.
- Ser coherente con el objetivo real del problema.
- Ser eficiente, porque se evaluará muchas veces.
- Penalizar soluciones inválidas si el problema tiene restricciones.

Ejemplo con penalización:

```text
fitness = calidad_de_la_solución - penalización_por_violar_restricciones
```

---

## 7. Representación de soluciones

Antes de usar un Algoritmo Genético, se debe responder esta pregunta:

> ¿Cómo voy a representar cada solución como un cromosoma?

Esta decisión afecta todo el algoritmo. Una representación mala puede generar hijos inválidos, dificultar la mutación o hacer que el algoritmo tarde más.

---

### 7.1 Representación binaria

Usa cadenas de 0 y 1.

```text
1010011010
```

Es útil cuando se trabaja con valores booleanos, decisiones sí/no o números codificados en binario.

Ejemplo:

```text
1 = tomar el objeto
0 = no tomar el objeto
```

Cromosoma:

```text
[1, 0, 1, 1, 0]
```

Significa que se toman los objetos 1, 3 y 4.

---

### 7.2 Representación entera

Usa números enteros.

```text
[2, 5, 1, 8]
```

Sirve cuando cada gen representa una categoría, índice o cantidad discreta.

Ejemplo:

```text
[3, 1, 4, 2]
```

Puede representar asignaciones, turnos, máquinas, colores o posiciones.

---

### 7.3 Representación real

Usa números decimales.

```text
[0.25, 3.78, -1.40]
```

Sirve para problemas con variables continuas, como coordenadas, pesos, velocidades o parámetros matemáticos.

Ejemplo:

```text
x = 2.484
```

Puede ser una solución en un problema de optimización de funciones.

---

### 7.4 Representación por permutación

Usa una lista donde cada elemento aparece una sola vez.

```text
[3, 2, 4, 1, 7, 5, 8, 6]
```

Sirve cuando el orden importa.

El ejemplo típico es el **Problema del Agente Viajero**, donde el viajero debe visitar cada ciudad una sola vez y regresar al origen.

Si el cromosoma es:

```text
[3, 2, 4, 1]
```

Significa:

```text
Ciudad 3 → Ciudad 2 → Ciudad 4 → Ciudad 1 → volver al inicio
```

En este tipo de representación hay que tener mucho cuidado: un cruce común puede producir ciudades repetidas o faltar ciudades.

Por eso se usan operadores especiales como **PMX** y **OX**.

---

### 7.5 Representación basada en árboles

Usa estructuras jerárquicas.

Es común cuando la solución representa una expresión, una regla o un programa.

Ejemplo conceptual:

```text
        +
       / \
      x   *
         / \
        3   y
```

Esto podría representar:

```text
x + 3y
```

Se usa mucho en programación genética.

---

### 7.6 Representación híbrida

Combina varios tipos.

Ejemplo:

```text
[1, 0, 1] + [2.5, 7.1] + [3, 1, 2]
```

Puede tener una parte binaria, una parte real y una parte de permutación.

Es útil en problemas complejos con distintos tipos de variables.

---

## 8. Ejemplo didáctico: el problema del agente viajero

El problema del agente viajero consiste en encontrar la ruta más corta para visitar varias ciudades exactamente una vez y volver al punto de partida.

Suponga que tenemos las ciudades:

```text
1, 2, 3, 4, 5
```

Una solución podría ser:

```text
[1, 3, 5, 2, 4]
```

Esto significa:

```text
1 → 3 → 5 → 2 → 4 → 1
```

La función de fitness puede estar basada en la distancia total.

Como el objetivo es minimizar distancia, se puede usar:

```text
fitness = 1 / distancia_total
```

Así, una ruta más corta tendrá mayor fitness.

Ejemplo:

```text
Ruta A: distancia = 100 → fitness = 1/100 = 0.01
Ruta B: distancia = 50  → fitness = 1/50  = 0.02
```

La Ruta B tiene mejor fitness porque recorre menos distancia.

---

## 9. Población inicial

La población inicial es el primer conjunto de soluciones con el que empieza el algoritmo.

Hay tres formas comunes de crearla.

### 9.1 Inicialización aleatoria

Se crean cromosomas al azar.

Ventaja: genera diversidad.

Desventaja: puede empezar con soluciones muy malas.

Ejemplo:

```text
101010
000111
110001
```

---

### 9.2 Inicialización heurística

Se usa conocimiento previo del problema para generar soluciones iniciales más buenas.

Ventaja: arranca cerca de buenas soluciones.

Desventaja: puede reducir diversidad si todos los individuos se parecen demasiado.

Ejemplo en rutas:

```text
Empezar con rutas construidas por cercanía entre ciudades.
```

---

### 9.3 Inicialización híbrida

Combina individuos aleatorios con individuos creados usando heurísticas.

Es una opción equilibrada:

```text
Parte de la población = aleatoria
Parte de la población = heurística
```

---

## 10. Selección

La selección decide qué individuos serán padres.

La idea es favorecer a los mejores, pero sin eliminar totalmente el azar.

Esto es importante porque, si siempre se eligiera al mejor, toda la población podría volverse igual demasiado rápido.

---

### 10.1 Selección por ruleta

Cada individuo recibe una porción de una ruleta proporcional a su fitness.

Ejemplo:

| Individuo | Fitness | Probabilidad aproximada |
|---|---:|---:|
| A | 10 | 10% |
| B | 30 | 30% |
| C | 60 | 60% |

El individuo C tiene más probabilidad de ser elegido, pero A y B todavía pueden salir.

**Ventaja:** es intuitiva.

**Desventaja:** si un individuo es demasiado bueno, puede dominar la población y reducir diversidad.

---

### 10.2 Selección por torneo

Se eligen al azar varios individuos y gana el mejor del grupo.

Ejemplo con torneo de 3:

```text
Participan: A, D, F
Fitness:    10, 35, 20
Gana:       D
```

**Ventaja:** es simple y permite controlar la presión selectiva.

Si el torneo es grande, gana casi siempre el mejor. Si el torneo es pequeño, hay más azar.

---

### 10.3 Selección por ranking

Primero se ordenan los individuos de mejor a peor. Luego se asignan probabilidades según la posición, no según el valor exacto del fitness.

Esto evita que un individuo con fitness exageradamente alto domine toda la selección.

Ejemplo:

```text
1° lugar: mayor probabilidad
2° lugar: probabilidad media
3° lugar: menor probabilidad
```

---

### 10.4 Elitismo

El elitismo consiste en copiar directamente a los mejores individuos a la siguiente generación.

Ejemplo:

```text
Mejor individuo actual: 101111
Se copia sin cambios a la nueva población.
```

Esto evita perder la mejor solución por culpa de un cruce o una mutación.

**Cuidado:** demasiado elitismo puede reducir diversidad.

---

## 11. Cruzamiento o recombinación

El cruzamiento combina información de dos padres para generar hijos.

La intención es que los hijos hereden partes útiles de ambos padres.

La tasa de cruce suele ser alta, normalmente entre `0.6` y `0.9`.

---

### 11.1 Cruzamiento de un punto

Se elige un punto de corte y se intercambian las partes derechas.

```text
Padre 1: 111|000
Padre 2: 000|111

Hijo 1: 111|111
Hijo 2: 000|000
```

Es simple, pero puede romper bloques largos de información útil.

---

### 11.2 Cruzamiento de dos puntos

Se eligen dos puntos y se intercambia la parte central.

```text
Padre 1: 11|000|11
Padre 2: 00|111|00

Hijo 1: 11|111|11
Hijo 2: 00|000|00
```

Explora mejor que el de un punto, porque puede intercambiar segmentos internos.

---

### 11.3 Cruzamiento uniforme

Se usa una máscara para decidir de qué padre se toma cada gen.

```text
Padre 1: 1 1 1 1 1
Padre 2: 0 0 0 0 0
Máscara: 1 0 1 0 1

Hijo:   1 0 1 0 1
```

Cuando la máscara tiene `1`, se toma el gen del Padre 1. Cuando tiene `0`, se toma del Padre 2.

**Ventaja:** genera mucha diversidad.

**Desventaja:** puede romper combinaciones útiles si se usa demasiado agresivamente.

---

### 11.4 Cruzamiento en permutaciones

En permutaciones no se pueden repetir elementos.

Ejemplo inválido:

```text
[1, 2, 3, 3, 5]
```

Aquí falta el 4 y se repite el 3.

Por eso se usan operadores especiales.

#### PMX

PMX intercambia un segmento entre padres y luego corrige los valores restantes para evitar duplicados.

La idea intuitiva es:

```text
1. Copiar un bloque de un padre.
2. Usar correspondencias para corregir repeticiones.
3. Completar el hijo manteniendo una permutación válida.
```

Sirve cuando importa conservar posiciones y relaciones entre elementos.

#### OX

OX copia un segmento de un padre y completa el resto siguiendo el orden del otro padre.

La idea intuitiva es:

```text
1. Copiar una parte del Padre 1.
2. Leer el Padre 2 en orden.
3. Insertar los elementos faltantes sin repetir.
```

Sirve cuando importa preservar el orden relativo.

---

## 12. Mutación

La mutación introduce pequeños cambios aleatorios.

Su objetivo principal es mantener diversidad y evitar que el algoritmo se quede atrapado.

La tasa de mutación suele ser baja, por ejemplo entre `0.001` y `0.01`, aunque depende del problema.

Si la mutación es demasiado alta, el algoritmo se vuelve casi aleatorio.  
Si es demasiado baja, puede perder diversidad.

---

### 12.1 Mutación de bit

Se usa en cromosomas binarios.

```text
Antes:   101100
Después: 101000
              ↑
           bit mutado
```

Un 1 cambia a 0 o un 0 cambia a 1.

---

### 12.2 Mutación uniforme

Se usa en valores enteros o reales.

Ejemplo:

```text
Antes:   [3, 7, 2]
Después: [3, 9, 2]
```

Un gen se reemplaza por otro valor permitido.

---

### 12.3 Mutación gaussiana

Se usa en valores reales.

En lugar de reemplazar completamente el valor, se le suma una pequeña variación.

```text
Antes:   2.50
Cambio: +0.03
Después: 2.53
```

Es útil cuando ya se está cerca de una buena solución y se quieren hacer ajustes finos.

---

### 12.4 Mutación por intercambio

Común en permutaciones.

```text
Antes:   [1, 2, 3, 4, 5]
Después: [1, 4, 3, 2, 5]
```

Se intercambian dos posiciones.

---

### 12.5 Mutación por inserción

Se toma un elemento y se inserta en otra posición.

```text
Antes:   [1, 2, 3, 4, 5]
Mover 4
Después: [1, 4, 2, 3, 5]
```

---

### 12.6 Mutación por inversión

Se elige un segmento y se invierte.

```text
Antes:   [1, 2, 3, 4, 5, 6]
Después: [1, 5, 4, 3, 2, 6]
```

Es muy útil en problemas de rutas.

---

## 13. Reemplazo

Después de crear hijos, se decide cómo formar la siguiente generación.

---

### 13.1 Reemplazo generacional puro

Toda la población anterior se reemplaza por los hijos.

```text
Padres → desaparecen
Hijos  → nueva población
```

Ventaja: cambio rápido.

Desventaja: se puede perder una solución muy buena.

---

### 13.2 Reemplazo estacionario

Solo se reemplazan algunos individuos, normalmente los peores.

```text
Se crean pocos hijos
Los hijos sustituyen a individuos de baja aptitud
```

Ventaja: evolución más gradual.

---

### 13.3 Reemplazo con elitismo

Los mejores individuos pasan directamente.

```text
Mejores padres + hijos nuevos = nueva población
```

Es una forma de proteger buenas soluciones.

---

### 13.4 Reemplazo basado en torneo

Un hijo compite contra un individuo actual. El mejor queda.

```text
Hijo vs individuo actual → sobrevive el de mejor fitness
```

---

## 14. Criterios de parada

Un Algoritmo Genético no puede ejecutarse para siempre. Por eso se define cuándo detenerlo.

Criterios comunes:

| Criterio | Significado |
|---|---|
| Número máximo de generaciones | Se detiene después de cierta cantidad de ciclos. |
| Número máximo de evaluaciones | Se limita cuántas veces se calcula el fitness. |
| Convergencia de la población | Los individuos ya son muy parecidos. |
| Estancamiento | El mejor individuo no mejora durante varias generaciones. |
| Umbral de calidad | Se encontró una solución suficientemente buena. |
| Límite de tiempo | Se detiene después de cierto tiempo. |

En la práctica se suelen combinar varios criterios.

Ejemplo:

```text
Detener si:
- se llegó a 500 generaciones, o
- no mejora en 50 generaciones, o
- el fitness supera 0.99.
```

---

## 15. Ejemplo completo: maximizar una función

El informe usa un ejemplo de optimización:

```text
f(x) = -x² + 5x + 3
```

en el intervalo:

```text
0 < x < 4
```

con precisión de 3 decimales.

---

### 15.1 ¿Cuál es el objetivo?

Se quiere encontrar el valor de `x` que hace máxima la función.

La función es una parábola abierta hacia abajo:

```text
f(x) = -x² + 5x + 3
```

Su máximo real está cerca de:

```text
x = 2.5
f(x) = 9.25
```

El Algoritmo Genético intentará acercarse a ese valor.

---

### 15.2 ¿Por qué se codifica en binario?

El algoritmo trabaja con cromosomas. Para representar números reales, se puede usar una cadena binaria.

Como se necesita precisión de 0.001 en el intervalo de 0 a 4, se necesita una cantidad suficiente de bits para representar muchos valores posibles.

El informe calcula una longitud aproximada de:

```text
l = 12 bits
```

Entonces cada individuo puede verse así:

```text
10,0111110000
```

Ese cromosoma binario se decodifica a un número real.

---

### 15.3 Fase 1: población inicial

Se generan varios cromosomas al azar.

Ejemplo conceptual:

| Individuo | Cromosoma | x aproximado | f(x) |
|---|---|---:|---:|
| x1 | 1110010101 | 3.79 | 5.88 |
| x2 | 0110001110 | 1.54 | 8.34 |
| x3 | 0000111000 | 0.11 | 4.96 |
| x4 | 1001011000 | 2.39 | 9.23 |
| x5 | 1000011101 | 2.05 | 9.05 |

La idea es evaluar cada uno y ver cuál se acerca más al máximo.

---

### 15.4 Fase 2: selección

Los individuos con mejor `f(x)` tienen más probabilidad de ser seleccionados.

Si se usa ruleta, cada individuo recibe un segmento proporcional a su fitness.

Ejemplo conceptual:

```text
x4 tiene fitness alto → mayor probabilidad
x1 tiene fitness bajo → menor probabilidad
```

Después de seleccionar, puede ocurrir que algunos individuos buenos aparezcan varias veces como padres.

---

### 15.5 Fase 3: cruzamiento

Suponga que se cruzan dos padres en un punto de corte.

```text
Padre 1 = 10,01011|10000
Padre 2 = 10,00001|11010
```

Se intercambian las colas:

```text
Hijo 1 = 10,01011|11010
Hijo 2 = 10,00001|10000
```

Esto mezcla información de ambos padres.

---

### 15.6 Fase 4: mutación

Después del cruce, puede mutar un bit.

Ejemplo del informe:

```text
Antes:   10,0101110000
Después: 10,0111110000
```

Ese pequeño cambio puede mejorar el valor de la función.

En el ejemplo, después de la mutación se obtiene aproximadamente:

```text
x = 2.484375
f(x) = 9.2497
```

Esto está muy cerca del óptimo real:

```text
x = 2.5
f(x) = 9.25
```

**Lo importante del ejemplo:** en una sola generación, el algoritmo ya se acercó mucho a la mejor solución.

---

## 16. Dinámica evolutiva

La dinámica evolutiva estudia cómo cambia la población con el tiempo.

En cada generación:

```text
1. Algunos individuos desaparecen.
2. Otros se copian.
3. Algunos se cruzan.
4. Algunos mutan.
5. La población cambia.
```

El objetivo es que, con el tiempo, el fitness promedio y el fitness del mejor individuo mejoren.

Pero esto no siempre ocurre perfectamente. El algoritmo puede tener problemas.

---

## 17. Exploración y explotación

Este es uno de los conceptos más importantes.

### Exploración

Explorar significa buscar en zonas nuevas del espacio de soluciones.

La mutación ayuda a explorar.

Ejemplo:

```text
Probar una ruta totalmente distinta.
Probar un valor de x que aún no apareció.
```

### Explotación

Explotar significa aprovechar soluciones que ya parecen buenas.

La selección y el cruzamiento ayudan a explotar.

Ejemplo:

```text
Tomar partes buenas de dos padres y combinarlas.
```

Un buen Algoritmo Genético necesita equilibrio:

```text
Demasiada exploración → búsqueda aleatoria.
Demasiada explotación → convergencia prematura.
```

---

## 18. Convergencia prematura

La convergencia prematura ocurre cuando la población se vuelve demasiado parecida antes de encontrar el óptimo global.

Ejemplo:

```text
Generación 1:
101010
110011
000111
011001

Generación 50:
111111
111111
111111
111111
```

Si todos son iguales, el cruce ya no produce nada nuevo. Solo la mutación puede rescatar diversidad.

El algoritmo se queda atrapado en una solución que parece buena, pero quizá no es la mejor.

---

## 19. Presión selectiva

La presión selectiva mide qué tanto se favorece a los mejores individuos.

- Presión alta: los mejores se reproducen mucho.
- Presión baja: todos tienen oportunidades parecidas.

Si la presión es demasiado alta, se pierde diversidad.  
Si la presión es demasiado baja, el algoritmo avanza muy lento.

Ejemplo:

```text
Presión muy alta:
El mejor individuo domina la población rápidamente.

Presión muy baja:
Los malos se reproducen casi igual que los buenos.
```

---

## 20. Mecanismos para mantener diversidad

El informe presenta varios métodos para controlar la presión selectiva y evitar pérdida de diversidad.

---

### 20.1 Hacer positiva la función en problemas de minimización

Cuando se minimiza, los valores menores son mejores. Pero muchos métodos de selección necesitan que mayor fitness signifique mejor solución.

Ejemplo: minimizar tiempo.

```text
Individuo A: 10 segundos
Individuo B: 30 segundos
Individuo C: 50 segundos
```

El menor tiempo es mejor, pero si usamos esos valores como fitness, parecería que 50 es mejor que 10.

Se transforma así:

```text
fitness = Cmax - g(x)
```

Si `Cmax = 52.5`:

```text
A: 52.5 - 10 = 42.5
B: 52.5 - 30 = 22.5
C: 52.5 - 50 = 2.5
```

Ahora el individuo más rápido tiene mayor fitness.

---

### 20.2 Escalado lineal

Sirve para evitar que un individuo extremadamente bueno domine toda la población.

Ejemplo:

```text
Promedio = 50
Mejor individuo = 500
```

Si se usa ruleta directamente, el de 500 gana demasiado espacio.

El escalado lineal reajusta los valores para conservar diferencias, pero sin permitir dominio excesivo.

Idea:

```text
El mejor sigue siendo el mejor,
pero no destruye la diversidad.
```

---

### 20.3 Escalado sigma

Usa la desviación estándar de la población.

La intuición:

- Si los individuos son muy distintos, reduce diferencias para permitir exploración.
- Si los individuos son muy parecidos, amplifica pequeñas diferencias para refinar la selección.

Es como un “zoom automático”.

```text
Población muy dispersa → suaviza diferencias.
Población muy parecida → resalta diferencias.
```

---

### 20.4 Escalado por potencias

Eleva los valores de fitness a una potencia.

Ejemplo:

```text
fitness_original = 100 y 101
k = 1.05
```

La diferencia se estira un poco, sin exagerar.

Sirve cuando las diferencias entre individuos son demasiado pequeñas.

---

## 21. Ajuste de parámetros

Los parámetros controlan el comportamiento del algoritmo.

---

### 21.1 Tamaño de población

Población pequeña:

```text
+ rápida
- poca diversidad
- más riesgo de convergencia prematura
```

Población grande:

```text
+ más diversidad
+ mejor exploración
- más costo computacional
```

---

### 21.2 Tasa de cruce

Indica con qué frecuencia se cruzan los padres.

Valores comunes:

```text
0.6 a 0.9
```

Tasa alta:

```text
+ combina más información
- puede romper bloques útiles si es excesiva
```

Tasa baja:

```text
+ conserva padres
- explora menos combinaciones
```

---

### 21.3 Tasa de mutación

Indica la probabilidad de alterar genes.

Valores comunes:

```text
0.001 a 0.01
```

Tasa alta:

```text
+ mucha exploración
- puede destruir soluciones buenas
```

Tasa baja:

```text
+ estabilidad
- puede perder diversidad
```

---

## 22. ¿Por qué funcionan los Algoritmos Genéticos?

Los Algoritmos Genéticos no son simples búsquedas aleatorias. Funcionan porque tienden a conservar y combinar partes útiles de las soluciones.

Para entender esto, el informe usa la teoría de esquemas.

---

## 23. Esquemas

Un esquema es una plantilla que representa un conjunto de cromosomas.

Usa tres símbolos:

```text
0, 1, *
```

El `*` significa “puede ser 0 o 1”.

Ejemplo:

```text
Esquema: 1*0*1
```

Representa todos los cromosomas de 5 bits que tienen:

```text
posición 1 = 1
posición 3 = 0
posición 5 = 1
posición 2 = cualquiera
posición 4 = cualquiera
```

Cromosomas representados:

```text
10001
10011
11001
11011
```

Un esquema es como decir:

> No me importa todo el cromosoma, solo me importan ciertas posiciones.

---

## 24. Orden de un esquema

El orden es la cantidad de posiciones fijas.

Ejemplo:

| Esquema | Posiciones fijas | Orden |
|---|---|---:|
| `1*0*1` | 1, 3, 5 | 3 |
| `**0**` | 3 | 1 |
| `10101` | 1, 2, 3, 4, 5 | 5 |
| `*****` | ninguna | 0 |

Mientras mayor sea el orden, más específico es el esquema.

También es más vulnerable a mutación, porque hay más posiciones importantes que podrían cambiar.

---

## 25. Longitud definitoria

La longitud definitoria es la distancia entre la primera y la última posición fija.

Ejemplo:

```text
Esquema: 1*0*1
Primera posición fija: 1
Última posición fija: 5
Longitud definitoria: 5 - 1 = 4
```

Otro ejemplo:

```text
Esquema: **011
Primera fija: 3
Última fija: 5
Longitud definitoria: 2
```

La longitud definitoria importa porque los esquemas largos son más fáciles de romper con el cruce.

---

## 26. Teorema de los esquemas

La idea principal del teorema es:

> Los esquemas cortos, de bajo orden y con fitness superior al promedio tienden a multiplicarse generación tras generación.

Esto significa que el algoritmo favorece pequeñas combinaciones buenas de genes.

La fórmula general del informe es:

```text
E[m(Q, t+1)] ≥ m(Q, t) · [eval(Q,t) / F(t)] · [1 − pc · δ(Q)/(l−1) − o(Q)·pm]
```

No necesita memorizarla. Lo importante es interpretar sus partes.

---

### 26.1 Factor de selección

```text
eval(Q,t) / F(t)
```

Compara el fitness del esquema con el fitness promedio.

Si es mayor que 1:

```text
El esquema es mejor que el promedio → tiende a crecer.
```

Si es menor que 1:

```text
El esquema es peor que el promedio → tiende a disminuir.
```

---

### 26.2 Factor de cruce

```text
1 − pc · δ(Q)/(l−1)
```

Mide la probabilidad de que el cruce no destruya el esquema.

Si la longitud definitoria `δ(Q)` es grande, hay más riesgo de romperlo.

Por eso sobreviven mejor los esquemas compactos.

---

### 26.3 Factor de mutación

```text
1 − o(Q)·pm
```

Mide la probabilidad de que la mutación no destruya posiciones fijas.

Si el orden `o(Q)` es alto, hay más posiciones importantes y más riesgo.

Por eso sobreviven mejor los esquemas de bajo orden.

---

## 27. Hipótesis de bloques constructivos

La hipótesis de bloques dice que los Algoritmos Genéticos construyen soluciones buenas combinando pequeños bloques buenos.

Un bloque constructivo es:

```text
un esquema corto + de bajo orden + con buen fitness
```

Analogía:

> Es como armar un rompecabezas. Primero se forman pedacitos que encajan bien, luego esos pedacitos se combinan para formar partes más grandes, hasta acercarse a la solución completa.

El cruce es importante porque permite juntar bloques buenos de distintos padres.

Ejemplo:

```text
Padre 1 tiene un bloque bueno al inicio.
Padre 2 tiene un bloque bueno al final.
El hijo puede heredar ambos bloques.
```

---

## 28. Convergencia

El informe menciona que sin elitismo no se garantiza llegar al óptimo global.

¿Por qué?

Porque el mejor individuo puede perderse por cruce o mutación.

Ejemplo:

```text
Generación 10: aparece el mejor individuo.
Cruzamiento: se rompe.
Mutación: se altera.
Resultado: se perdió.
```

Con elitismo, el mejor individuo se copia directamente y no se pierde.

Para tener garantía probabilística de convergencia se necesitan dos condiciones:

```text
1. Elitismo: proteger el mejor individuo.
2. Mutación mayor que cero: permitir alcanzar cualquier solución eventualmente.
```

Esto no significa que siempre se llegará rápido al óptimo, sino que, con suficientes generaciones, aumenta la probabilidad de encontrarlo.

---

## 29. Errores comunes al estudiar Algoritmos Genéticos

### Error 1: pensar que siempre encuentran la solución perfecta

No siempre. Muchas veces encuentran una solución muy buena, no necesariamente la óptima.

---

### Error 2: pensar que son búsqueda aleatoria

Tienen azar, pero no son aleatorios sin dirección. La función de fitness guía la búsqueda.

---

### Error 3: usar cualquier representación

La representación debe adaptarse al problema. En rutas se usan permutaciones; en variables continuas se usan reales; en decisiones sí/no se usan bits.

---

### Error 4: usar mutación demasiado alta

La mutación alta destruye información buena y convierte el proceso en ruido.

---

### Error 5: no usar elitismo

Sin elitismo, el algoritmo puede perder la mejor solución encontrada.

---

### Error 6: confundir función objetivo con fitness

A veces son iguales, pero no siempre.

Si se maximiza:

```text
fitness = función objetivo
```

Si se minimiza:

```text
fitness = transformación de la función objetivo
```

| Operador | Qué hace | Para qué sirve | Riesgo |
|---|---|---|---|
| Selección | Elige padres | Favorece buenas soluciones | Puede reducir diversidad |
| Cruzamiento | Mezcla padres | Combina bloques buenos | Puede romper información útil |
| Mutación | Cambia genes al azar | Explora nuevas soluciones | Si es alta, vuelve aleatoria la búsqueda |
| Reemplazo | Forma nueva población | Controla continuidad evolutiva | Puede perder buenos individuos |
| Elitismo | Copia los mejores | Protege la mejor solución | Si es excesivo, reduce diversidad |

---

## 32. Tabla rápida de representaciones

| Representación | Ejemplo | Uso típico | Cuidado principal |
|---|---|---|---|
| Binaria | `101011` | Decisiones sí/no, codificación numérica | Decodificación correcta |
| Entera | `[2, 5, 1]` | Asignaciones, índices | Respetar rangos |
| Real | `[2.4, 0.7]` | Variables continuas | Ajustar mutación |
| Permutación | `[3, 1, 2, 4]` | Rutas, ordenamientos | Evitar repetidos |
| Árbol | expresión jerárquica | Programación genética | Mayor costo |
| Híbrida | mezcla | Problemas complejos | Operadores más difíciles |

---

## 33. Mini guía para diseñar un Algoritmo Genético

Antes de programar, responda estas preguntas:

1. ¿Qué representa una solución?
2. ¿Cómo se codificará el cromosoma?
3. ¿Cómo se calcula el fitness?
4. ¿El problema es de maximización o minimización?
5. ¿Qué método de selección se usará?
6. ¿Qué tipo de cruce es compatible con la representación?
7. ¿Qué tipo de mutación tiene sentido?
8. ¿Se usará elitismo?
9. ¿Cuándo se detendrá el algoritmo?
10. ¿Cómo se evitará la pérdida de diversidad?

---

## 34. Preguntas de repaso

1. ¿Por qué los Algoritmos Genéticos trabajan con una población y no con una sola solución?
2. ¿Qué diferencia hay entre genotipo y fenotipo?
3. ¿Por qué la función de fitness es tan importante?
4. ¿Qué puede pasar si la tasa de mutación es demasiado alta?
5. ¿Qué problema evita el elitismo?
6. ¿Por qué los operadores comunes de cruce pueden fallar en permutaciones?
7. ¿Qué es la convergencia prematura?
8. ¿Qué significa presión selectiva?
9. ¿Qué representa un esquema?
10. ¿Qué dice la hipótesis de bloques constructivos?

---

## 35. Respuestas cortas para repasar

1. Porque una población permite explorar varias zonas del espacio de búsqueda al mismo tiempo.
2. El genotipo es la codificación; el fenotipo es la solución interpretada.
3. Porque guía todo el proceso evolutivo.
4. El algoritmo puede volverse casi aleatorio.
5. Evita perder la mejor solución encontrada.
6. Porque pueden generar elementos repetidos o faltantes.
7. Es cuando la población se vuelve uniforme antes de llegar al óptimo global.
8. Es la intensidad con que se favorece a los individuos más aptos.
9. Es una plantilla que representa varios cromosomas con posiciones comunes.
10. Que el algoritmo combina pequeños bloques buenos para formar soluciones mejores.

---

## 36. Conclusión didáctica

Los Algoritmos Genéticos son métodos de búsqueda inspirados en la evolución natural. Su fuerza está en trabajar con muchas soluciones al mismo tiempo y mejorarlas mediante selección, cruzamiento y mutación.

La selección permite favorecer las soluciones buenas. El cruzamiento combina información útil. La mutación introduce novedad. El reemplazo decide qué individuos continúan. El elitismo protege las mejores soluciones.

El éxito del algoritmo depende de encontrar un equilibrio entre:

```text
Explorar nuevas soluciones
y
Explotar las soluciones buenas ya encontradas
```

La teoría de esquemas y la hipótesis de bloques explican por qué los Algoritmos Genéticos pueden funcionar bien: no buscan a ciegas, sino que tienden a conservar y combinar fragmentos de soluciones que han demostrado ser útiles.

En una sola frase:

> Un Algoritmo Genético evoluciona soluciones: conserva lo bueno, mezcla lo prometedor, cambia un poco al azar y repite hasta acercarse a una respuesta de alta calidad.

# Resumen didáctico: Redes Generativas Antagónicas (GANs)

> **Objetivo de esta guía:** entender el tema de forma clara, paso a paso y con ejemplos.  
> La idea no es memorizar fórmulas, sino comprender **qué problema resuelven las GANs**, **cómo funcionan internamente**, **cómo se entrenan** y **por qué pueden generar datos realistas**.

---

## 1. Idea central del tema

Las **Redes Generativas Antagónicas**, conocidas como **GANs** por sus siglas en inglés *Generative Adversarial Networks*, son modelos de inteligencia artificial capaces de **crear datos nuevos** que se parecen a datos reales.

Por ejemplo, una GAN puede generar:

- rostros de personas que no existen;
- imágenes de animales artificiales;
- paisajes inventados;
- texturas para videojuegos;
- imágenes médicas sintéticas;
- fotos antiguas restauradas;
- imágenes borrosas convertidas en versiones más nítidas.

La palabra clave es **generar**.  
Un modelo común de inteligencia artificial puede mirar una imagen y decir:

> “Esto es un gato”.

Una GAN, en cambio, puede crear una nueva imagen de un gato que nunca existió.

---

## 2. Antes de entender GANs: ¿qué es una red neuronal artificial?

Una **Red Neuronal Artificial (RNA)** es un modelo computacional inspirado de forma general en el cerebro humano, pero no funciona igual que un cerebro real.

Una red neuronal no “piensa” como una persona. Más bien, realiza muchas operaciones matemáticas para transformar datos de entrada en una salida útil.

Por ejemplo:

```text
Imagen de entrada → Red neuronal → Resultado
```

Si es una red clasificadora, el resultado puede ser:

```text
98% gato
2% perro
```

Si es una red generativa, el resultado puede ser:

```text
Una imagen nueva creada por la red
```

---

## 3. Diferencia entre cerebro humano y red neuronal artificial

La inspiración biológica viene de las neuronas humanas, pero una red neuronal artificial es una simplificación matemática.

| Aspecto | Cerebro humano | Red neuronal artificial |
|---|---|---|
| Unidad básica | Neuronas biológicas | Neuronas artificiales o nodos |
| Señales | Impulsos electroquímicos | Números, vectores, matrices |
| Energía | Muy eficiente | Requiere mucha energía y hardware |
| Aprendizaje | Biológico, complejo y contextual | Ajuste de pesos mediante datos |
| Funcionamiento | Asíncrono y muy flexible | Cálculo matemático organizado |

La idea importante es esta:

> Una red neuronal artificial aprende ajustando números internos llamados **pesos** y **sesgos**.

---

## 4. Estructura básica de una red neuronal

Una red neuronal suele organizarse en capas.

```text
Entrada → Capas ocultas → Salida
```

### 4.1. Capa de entrada

Es donde entran los datos.

Si se trabaja con una imagen, la computadora no ve “una cara” o “un perro”. Ve números.

Una imagen RGB tiene tres canales:

```text
Rojo, Verde, Azul
```

Cada píxel se representa con valores numéricos. Por eso, una imagen para una red neuronal es realmente una matriz o tensor de números.

### 4.2. Capas ocultas

Son las capas que procesan la información.

En imágenes, las primeras capas pueden aprender cosas simples:

```text
bordes, cambios de color, líneas
```

Las capas más profundas pueden aprender patrones más complejos:

```text
ojos, nariz, textura, forma de rostro
```

### 4.3. Capa de salida

La salida depende del tipo de red.

Si la red clasifica, puede dar una etiqueta:

```text
real / falso
gato / perro
positivo / negativo
```

Si la red genera, puede producir datos nuevos:

```text
una imagen completa
un rostro artificial
una textura nueva
```

---

## 5. Componentes matemáticos de una red neuronal

Una neurona artificial puede resumirse con esta fórmula:

\[
y = f\left(\sum_{i=1}^{n} w_i x_i + b\right)
\]

Dicho en palabras:

```text
La neurona recibe entradas,
las multiplica por pesos,
les suma un sesgo,
y luego aplica una función de activación.
```

### 5.1. Entradas \(x_i\)

Son los datos que recibe la neurona.  
Pueden ser píxeles, valores de audio, números de un vector, etc.

### 5.2. Pesos \(w_i\)

Los pesos indican la importancia de cada entrada.

Ejemplo simple:

```text
Si un peso es grande, esa entrada influye mucho.
Si un peso es pequeño, esa entrada influye poco.
```

Los pesos son como la **memoria aprendida** de la red.

### 5.3. Sesgo \(b\)

El sesgo permite desplazar la decisión de la neurona.

Una analogía sencilla:

> Si los pesos deciden la inclinación de una regla, el sesgo decide dónde se coloca esa regla.

Sin sesgo, la red sería mucho menos flexible.

### 5.4. Función de activación \(f\)

La función de activación permite que la red aprenda relaciones no lineales.

Sin activaciones, muchas capas juntas serían equivalentes a una sola operación lineal.  
Con activaciones, la red puede aprender patrones complejos.

Una función muy usada es **ReLU**:

\[
f(x) = \max(0,x)
\]

Significa:

```text
Si el valor es negativo, lo convierte en 0.
Si el valor es positivo, lo deja pasar.
```

---

## 6. ¿Qué significa que una red “aprenda”?

Una red neuronal aprende ajustando sus pesos y sesgos para reducir errores.

El proceso general es:

```text
1. Recibe datos.
2. Produce una salida.
3. Se compara la salida con lo esperado.
4. Se calcula el error.
5. Se ajustan los pesos.
6. Se repite muchas veces.
```

En una red tradicional, el objetivo puede ser clasificar bien.  
En una GAN, el objetivo es más interesante: **generar datos tan realistas que otra red no pueda distinguirlos de los reales**.

---

# 7. ¿Qué es una GAN?

Una GAN es un sistema formado por **dos redes neuronales**:

1. **Generador**
2. **Discriminador**

Estas dos redes compiten entre sí.

La forma más fácil de entenderlo es con la analogía:

```text
Generador = falsificador
Discriminador = detective
```

El falsificador intenta crear algo falso que parezca real.  
El detective intenta descubrir si eso es falso o verdadero.

Mientras compiten, ambos mejoran.

---

## 8. Las dos partes principales de una GAN

## 8.1. Generador

El **generador** crea datos artificiales.

Recibe una entrada aleatoria llamada **ruido** o **vector latente**.

\[
G(z) = x'
\]

Donde:

| Símbolo | Significado |
|---|---|
| \(G\) | Generador |
| \(z\) | Ruido o vector latente |
| \(x'\) | Dato artificial generado |

Ejemplo:

```text
Ruido aleatorio → Generador → Rostro falso
```

Al inicio, el generador produce resultados malos:

```text
manchas, formas deformes, imágenes sin sentido
```

Pero con entrenamiento, aprende a producir resultados más realistas.

---

## 8.2. Discriminador

El **discriminador** evalúa si un dato parece real o falso.

\[
D(x) = p
\]

Donde:

| Símbolo | Significado |
|---|---|
| \(D\) | Discriminador |
| \(x\) | Dato recibido |
| \(p\) | Probabilidad de que el dato sea real |

Ejemplo:

```text
D(imagen) = 0.95
```

Eso significa:

```text
El discriminador cree que la imagen tiene 95% de probabilidad de ser real.
```

Si recibe una imagen falsa y responde 0.95, entonces el generador logró engañarlo.

---

## 9. Funcionamiento general de una GAN

El proceso básico puede verse así:

```text
Ruido z → Generador G(z) → Imagen falsa x' → Discriminador D(x') → Real o falsa
```

Pero el discriminador también recibe datos reales:

```text
Imagen real → Discriminador → Real
Imagen falsa → Discriminador → Falsa
```

Entonces, el entrenamiento se basa en comparar dos tipos de muestras:

| Tipo de dato | Origen | Qué debería decir el discriminador |
|---|---|---|
| Real | Dataset de entrenamiento | Real |
| Falso | Generador | Falso |

El generador quiere que sus datos falsos sean clasificados como reales.  
El discriminador quiere no dejarse engañar.

---

# 10. Clasificar vs generar

Esta diferencia es fundamental.

| Acción | Qué hace | Ejemplo |
|---|---|---|
| Clasificar | Reconocer un dato existente | “Esta imagen es un gato” |
| Generar | Crear un dato nuevo | “Aquí hay una nueva imagen de un gato” |

En una GAN aparecen ambas ideas:

```text
El discriminador clasifica.
El generador crea.
```

Por eso una GAN combina reconocimiento y creación.

---

## 11. Espacio latente: el “mapa invisible” del generador

El generador empieza con un vector aleatorio:

\[
z = (z_1, z_2, z_3, ..., z_n)
\]

Ese vector pertenece al **espacio latente**.

Una forma sencilla de entenderlo:

> El espacio latente es como un mapa de posibilidades. Cada punto del mapa puede generar una imagen diferente.

Por ejemplo, en una GAN de rostros:

```text
Un punto del espacio latente → rostro con cabello corto
Otro punto → rostro con cabello largo
Otro punto → rostro con lentes
Otro punto → rostro con barba
```

El generador aprende a convertir puntos de ese espacio en datos con sentido.

---

## 12. Ejemplo: generación de rostros artificiales

Supongamos que se entrena una GAN con miles de fotos de rostros reales.

El proceso sería:

```text
1. El generador recibe ruido aleatorio.
2. Produce una imagen falsa.
3. El discriminador compara imágenes reales y falsas.
4. El discriminador intenta detectar la falsa.
5. El generador ajusta sus pesos para engañar mejor.
6. Se repite muchas veces.
```

Al inicio:

```text
La imagen parece ruido.
```

Después de muchas iteraciones:

```text
La imagen parece un rostro humano real.
```

Pero esa persona no existe.  
La GAN no copió una foto exacta, sino que aprendió patrones generales:

```text
posición de ojos,
proporción de nariz,
forma de boca,
color de piel,
iluminación,
estructura facial.
```

---

# 13. Arquitectura interna de una GAN

Una GAN puede representarse de forma general así:

\[
z \rightarrow G(z) \rightarrow \hat{x} \rightarrow D(\hat{x})
\]

Donde:

| Elemento | Función |
|---|---|
| \(z\) | Ruido aleatorio |
| \(G\) | Generador |
| \(\hat{x}\) | Muestra sintética |
| \(D\) | Discriminador |

---

## 14. Arquitectura del generador

El generador transforma ruido en datos.

Internamente, cada capa realiza operaciones como:

\[
h = f(Wx + b)
\]

Dicho en palabras:

```text
La capa recibe un vector,
lo multiplica por una matriz de pesos,
suma sesgos,
aplica una activación,
y produce una nueva representación.
```

En imágenes, el generador puede usar capas convolucionales o capas especiales para ir formando una imagen poco a poco.

Una forma didáctica de verlo:

```text
Ruido → patrones básicos → formas → texturas → imagen final
```

---

## 15. Arquitectura del discriminador

El discriminador funciona como un clasificador binario.

Recibe una muestra y devuelve un valor entre 0 y 1:

\[
D(x) \in [0,1]
\]

Interpretación:

```text
Cerca de 1 → parece real
Cerca de 0 → parece falso
```

En imágenes, el discriminador analiza:

```text
bordes,
formas,
texturas,
colores,
distribución de píxeles,
coherencia visual.
```

Su tarea es responder:

> “¿Esto parece venir del dataset real o parece generado?”

---

# 16. Entrenamiento de una GAN

El entrenamiento de una GAN es más complejo que el de una red normal porque hay dos redes aprendiendo al mismo tiempo.

La dinámica es:

```text
El discriminador aprende a detectar falsificaciones.
El generador aprende a hacer falsificaciones mejores.
```

No se busca que uno gane definitivamente.  
Se busca un equilibrio.

---

## 17. Pérdida o función de error

La **función de pérdida** mide qué tan mal lo está haciendo una red.

En una GAN hay dos pérdidas:

| Pérdida | Qué mide |
|---|---|
| Pérdida del discriminador | Qué tan bien distingue reales de falsos |
| Pérdida del generador | Qué tan bien engaña al discriminador |

### 17.1. Objetivo del discriminador

El discriminador quiere:

```text
Decir “real” a datos reales.
Decir “falso” a datos generados.
```

### 17.2. Objetivo del generador

El generador quiere:

```text
Crear datos falsos que el discriminador clasifique como reales.
```

Por eso se dice que una GAN funciona como un juego **minimax**:

```text
El discriminador intenta maximizar su acierto.
El generador intenta minimizar la capacidad del discriminador de detectarlo.
```

---

## 18. Cálculo del error

En cada iteración:

```text
1. El generador crea datos falsos.
2. El discriminador evalúa datos reales y falsos.
3. Se comparan sus respuestas con lo esperado.
4. Se calcula el error.
5. Ese error se usa para ajustar las redes.
```

El error no solo dice si algo estuvo mal. También indica:

```text
qué tan mal estuvo
y en qué dirección deben cambiar los pesos.
```

---

## 19. Retropropagación

La **retropropagación** o *backpropagation* envía el error hacia atrás dentro de la red para saber qué pesos deben cambiar.

Flujo normal:

```text
Entrada → Capas → Salida
```

Retropropagación:

```text
Error en salida → Capas anteriores → Ajuste de pesos
```

En una GAN, esto es especial porque el error del discriminador también ayuda al generador.

Si el discriminador detecta fácilmente una imagen falsa, esa información le sirve al generador para mejorar.

---

## 20. Descenso del gradiente

El **descenso del gradiente** es el método usado para actualizar los pesos.

Una analogía:

> Imagine que está en una montaña con los ojos vendados y quiere bajar al valle. El gradiente le dice hacia dónde inclina más el terreno. El descenso del gradiente usa esa dirección para moverse poco a poco hacia un punto con menor error.

En una GAN, el descenso del gradiente debe aplicarse con cuidado porque hay dos redes:

```text
Actualizar discriminador.
Actualizar generador.
Repetir.
```

Si una red aprende mucho más rápido que la otra, el entrenamiento se desequilibra.

---

# 21. Equilibrio entre generador y discriminador

Una GAN funciona bien cuando existe competencia equilibrada.

## 21.1. Si el discriminador es demasiado fuerte

El discriminador detecta todo como falso.  
Entonces el generador recibe poca información útil para mejorar.

Resultado:

```text
El generador no aprende bien.
```

## 21.2. Si el generador es demasiado fuerte

El discriminador se confunde demasiado rápido.  
Entonces deja de aportar una señal útil.

Resultado:

```text
El entrenamiento pierde estabilidad.
```

## 21.3. Lo ideal

Lo ideal es que ambos mejoren juntos.

```text
El generador mejora → el discriminador se exige más.
El discriminador mejora → el generador se exige más.
```

---

# 22. Problemas comunes en las GANs

## 22.1. Entrenamiento inestable

Las GANs son difíciles de entrenar porque no hay una sola red aprendiendo. Hay dos redes compitiendo.

Esto puede provocar:

```text
oscilaciones,
falta de convergencia,
resultados pobres,
aprendizaje desequilibrado.
```

## 22.2. Mode collapse

El **mode collapse** ocurre cuando el generador aprende a producir pocas variantes que engañan al discriminador.

Ejemplo:

```text
La GAN debería generar muchos tipos de rostros,
pero termina generando rostros casi iguales.
```

Es decir, produce datos realistas, pero poco variados.

## 22.3. Alto costo computacional

Entrenar GANs suele requerir:

```text
muchos datos,
GPUs,
tiempo,
ajuste de hiperparámetros,
memoria computacional.
```

## 22.4. Evaluación difícil

En clasificación es fácil medir exactitud:

```text
aciertos / total
```

Pero en generación es más difícil responder:

```text
¿Qué tan buena es esta imagen generada?
¿Qué tan realista es?
¿Qué tan diversa es?
```

Por eso evaluar GANs no es tan directo.

---

# 23. Aplicaciones de las GANs

Las GANs se usan en muchas áreas.

## 23.1. Generación de imágenes

Pueden crear:

```text
rostros,
animales,
paisajes,
objetos,
arte digital.
```

Ejemplo famoso:

```text
This Person Does Not Exist
```

Ese tipo de sistema genera rostros de personas que no existen.

## 23.2. Medicina

En medicina pueden usarse para:

```text
mejorar resonancias magnéticas,
aumentar resolución de tomografías,
reducir ruido en radiografías,
generar datos sintéticos para entrenamiento.
```

Esto es útil cuando hay pocos datos reales o restricciones de privacidad.

## 23.3. Restauración de imágenes

Una GAN puede:

```text
reconstruir fotos antiguas,
aumentar nitidez,
colorizar imágenes,
eliminar ruido,
completar partes faltantes.
```

## 23.4. Videojuegos y gráficos

Puede generar:

```text
texturas,
escenarios,
personajes,
objetos,
mundos virtuales.
```

Esto reduce tiempo de producción.

## 23.5. Redes sociales y multimedia

Se usan en:

```text
filtros faciales,
cambio de estilo,
avatares,
edición automática de fotografías,
conversión de rostros.
```

---

# 24. Ventajas de las GANs

| Ventaja | Explicación |
|---|---|
| Generan datos realistas | Pueden crear imágenes, audio o video convincentes |
| Aprenden patrones complejos | No necesitan reglas manuales |
| Crean datasets sintéticos | Ayudan cuando faltan datos reales |
| Mejoran imágenes | Sirven para super-resolución y restauración |
| Son flexibles | Se aplican a varias áreas |
| Automatizan tareas creativas | Reducen trabajo manual en diseño y edición |

La ventaja principal es:

> Una GAN puede aprender la distribución de los datos reales y usarla para crear nuevos ejemplos.

---

# 25. Riesgos éticos: deepfakes

Un **deepfake** es un contenido falso generado con inteligencia artificial que parece real.

Puede ser:

```text
imagen,
video,
audio,
rostro,
voz.
```

Las GANs pueden contribuir a crear deepfakes muy convincentes.

## 25.1. Riesgos principales

| Riesgo | Ejemplo |
|---|---|
| Desinformación | Videos falsos de figuras públicas |
| Suplantación | Alguien aparenta ser otra persona |
| Fraude | Uso de rostros o voces falsas |
| Manipulación política | Discursos falsos |
| Violación de privacidad | Uso no consentido de imagen personal |

La tecnología no es buena ni mala por sí sola.  
El problema aparece en el uso que se le da.

---

# 26. Resumen ultra simple del tema

Una GAN funciona así:

```text
1. El generador crea algo falso.
2. El discriminador intenta detectar si es falso.
3. El generador aprende a engañar mejor.
4. El discriminador aprende a detectar mejor.
5. Después de muchas rondas, el generador crea datos muy realistas.
```

En una frase:

> Una GAN es una competencia entre una red que crea y una red que juzga.

---

# 27. Mapa mental textual

```text
GAN
│
├── Generador
│   ├── Recibe ruido z
│   ├── Produce dato artificial G(z)
│   └── Quiere engañar al discriminador
│
├── Discriminador
│   ├── Recibe datos reales y falsos
│   ├── Devuelve probabilidad D(x)
│   └── Quiere distinguir real/falso
│
├── Entrenamiento
│   ├── Pérdida
│   ├── Error
│   ├── Retropropagación
│   ├── Descenso del gradiente
│   └── Ajuste de pesos
│
├── Aplicaciones
│   ├── Imágenes sintéticas
│   ├── Medicina
│   ├── Restauración
│   ├── Videojuegos
│   └── Multimedia
│
└── Problemas
    ├── Entrenamiento inestable
    ├── Mode collapse
    ├── Alto costo computacional
    └── Deepfakes
```

---

# 28. Fórmulas importantes explicadas

## 28.1. Neurona artificial

\[
y = f\left(\sum w_i x_i + b\right)
\]

Significa:

```text
entrada ponderada + sesgo + activación = salida
```

## 28.2. Generador

\[
G(z) = x'
\]

Significa:

```text
el generador transforma ruido en dato falso
```

## 28.3. Discriminador

\[
D(x) = p
\]

Significa:

```text
el discriminador devuelve la probabilidad de que x sea real
```

## 28.4. Flujo GAN

\[
z \rightarrow G(z) \rightarrow x' \rightarrow D(x')
\]

Significa:

```text
ruido → dato falso → evaluación real/falso
```

---

# 29. Preguntas de repaso

1. ¿Qué significa que una GAN sea generativa?
2. ¿Por qué se dice que una GAN es antagónica?
3. ¿Cuál es la función del generador?
4. ¿Cuál es la función del discriminador?
5. ¿Qué es el espacio latente?
6. ¿Por qué el generador comienza con ruido aleatorio?
7. ¿Qué significa \(D(x)=0.9\)?
8. ¿Qué diferencia hay entre clasificar y generar?
9. ¿Qué problema ocurre si el discriminador aprende demasiado rápido?
10. ¿Qué es el mode collapse?
11. ¿Qué aplicaciones positivas tienen las GANs?
12. ¿Qué riesgos éticos pueden generar?

---

# 30. Respuestas breves para comprobar comprensión

1. **Generativa** significa que puede crear datos nuevos.
2. **Antagónica** significa que dos redes compiten con objetivos opuestos.
3. El **generador** crea datos falsos realistas.
4. El **discriminador** decide si un dato parece real o falso.
5. El **espacio latente** es el conjunto de vectores desde donde el generador crea variaciones.
6. El ruido permite generar salidas diferentes.
7. \(D(x)=0.9\) significa que el discriminador cree que \(x\) tiene 90% de probabilidad de ser real.
8. Clasificar es reconocer; generar es crear.
9. Si el discriminador aprende demasiado rápido, el generador recibe poca señal útil.
10. Mode collapse es cuando el generador produce pocas variaciones repetidas.
11. Se usan en imágenes, medicina, videojuegos, restauración y multimedia.
12. Pueden usarse para deepfakes, fraude y desinformación.

---

# 31. Conclusión didáctica

Las GANs son una de las ideas más importantes del aprendizaje profundo porque permiten que la inteligencia artificial pase de **reconocer datos** a **crear datos nuevos**.

Su funcionamiento se basa en una competencia:

```text
Generador vs Discriminador
```

El generador intenta crear muestras artificiales realistas.  
El discriminador intenta detectar cuáles son reales y cuáles son falsas.  
Esa rivalidad obliga a ambas redes a mejorar.

Por eso, una GAN puede terminar creando imágenes, rostros, texturas o datos sintéticos que parecen reales.

Sin embargo, también son difíciles de entrenar y tienen riesgos éticos importantes, especialmente en la creación de deepfakes. Por eso, entender las GANs no solo implica saber cómo funcionan técnicamente, sino también reconocer su impacto social.

---

## Frase final para recordar

> **Una GAN es como un falsificador y un detective entrenando juntos: mientras uno aprende a crear mejores falsificaciones, el otro aprende a detectarlas; esa competencia hace que el sistema genere resultados cada vez más realistas.**
